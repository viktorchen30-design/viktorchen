<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <style>
    body {

      background: #f5f5f5; color: rgba(0,0,0,.88); padding: 24px; font-size: 14px;
    }
    .card {
      max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid #f0f0f0;
      border-radius: 8px; padding: 20px 24px;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { color: rgba(0,0,0,.55); font-size: 13px; line-height: 1.6; margin: 0 0 16px; }
    a.item {
      display: block; padding: 12px 14px; margin-bottom: 10px; border: 1px solid #d9d9d9;
      border-radius: 6px; text-decoration: none; color: #1677ff; font-weight: 600;
    }
    a.item:hover { border-color: #1677ff; background: #e6f4ff; }
    a.item span { display: block; font-weight: 400; color: rgba(0,0,0,.45); font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">

    <p>配置／权限／用户端分开。业务标识：<b>vb／va／game／live／square</b>（图按代号，顺序跟导航排序）。请分别打开：</p>

  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
    try {
      if (window.parent && window.parent !== window) {
        const h = Math.max(document.documentElement.scrollHeight, 280);
        window.parent.postMessage({ type: 'proto-resize', height: h + 8 }, '*');
      }
    } catch (e) {}
  </script>
