  <script>
    window.DOC_PAGE = {"title":"【H5／APP／BE】移动端顶部icon调整为后台可配置","text":"# 【H5／APP／BE】移动端顶部icon调整为后台可配置\n\n\u003cspan class=\"tag tag-fe\"\u003eH5\u003c/span\u003e\n\u003cspan class=\"tag tag-be\"\u003eAPP\u003c/span\u003e\n\u003cspan class=\"tag tag-be\"\u003eBE\u003c/span\u003e\n\u003cspan class=\"tag tag-site\"\u003e三站\u003c/span\u003e\n\u003cspan class=\"tag tag-site\"\u003e中国站\u003c/span\u003e\n\u003cspan class=\"tag tag-site\"\u003e越南站\u003c/span\u003e\n\u003cspan class=\"tag tag-site\"\u003e国际站\u003c/span\u003e\n\u003cspan class=\"tag tag-mod\"\u003e网站配置 · 顶部导航\u003c/span\u003e\n\u003cspan class=\"tag tag-pri\"\u003eH5／APP 布局一致 · 分端配图 · 中国站直播拆两套\u003c/span\u003e\n\n:::lead\nH5／APP 首页顶部导航（场馆B、场馆A、游戏、直播）当前 icon／文案调整成本高。本期在管理后台 **网站配置** 新增 **顶部导航配置**：运营可按 **三站**、**H5／APP 分端**、**日间／夜间**、**未选中／选中** 上传 icon 并维护名称；用户端按后台返回参数正确展示。  \n**【重要】H5 与 APP 布局一致**；**不含 PC**。  \n**【重要】本期只配 icon 图与名称**：本需求 **不借配置去改** 各格点击跳转／选中／业务能力；**不得因可配置而拦功能**。  \n**【重要】四格内容固定**：用户端始终这四项（场馆B／场馆A／游戏／第 4 格），**本功能只配图／名称**；**场馆B／场馆A 展示顺序**由「导航排序」等另功能负责，本页不展示、不操作排序；图／名按 `navItemCode` 绑定。  \n**【重要】中国站第 4 格 · 近期另有变动（仅注明）**：**本需求不写**该变动的具体内容。改版／变动时须 **另行留意** 是否与本配置逻辑关联（如 `live`／`square` 双套、按账号取套、图＋名下发、防闪／破图兜底等），避免互相踩坑；**与本期范围无关，只作关联提醒**。改版后 **icon／名称仍须走本后台配置**，不得改回写死。  \n**【重要】第 4 格 · 仅中国站**：账号分 **有直播／无直播**，后台须提供 **两套配置位** 加以区分（业务上常见为 **直播** 与 **广场**；列表类型标识能区分即可）。用户端第 4 格只出一格，按账号类型取对应套；**展示名称、图片均以后台接口为准**（名称本身不绑死文案）。越南站／国际站 **无此区分**，第 4 项仍 **一套**。\n:::\n\n:::info\n**一句话**：后台只配顶部导航 **icon／名称**；本需求不改交互。中国站第 4 格近期另有变动 **本篇不写变动内容**，改时留意与本配置是否关联；图＋名须继续走本配置；越／国际第 4 格一套；不改 PC。\n:::\n\n## 业务阅读指引（【重要】）\n\n:::info\n本文档 **业务与技术共用一份**。业务看 **业务速览** 即可；研发／测试看 **详版**。\n:::\n\n| 读者 | 怎么读 | 看到哪停 |\n| --- | --- | --- |\n| **业务** | **业务速览** | 「业务读到此处即可停」；可选再扫参考图／原型 |\n| **研发／测试** | 从 **研发／测试详版** 起全文 | 清单漏项＝漏改 |\n\n## 业务速览（业务需关注 · 约 3 分钟 · 看完可停）\n\n:::critical\n业务同学：**读完本节即可对齐方向**。后面是后台字段、异常、验收细则。\n:::\n\n### 用大白话说\n\n移动端头顶那一排：**场馆B、场馆A、游戏、直播**（图标 + 文字）。现在不好随时换图／改名。本期让运营在 **后台** 配好，**中国站／越南站／国际站** 都能配；**H5 和 APP 布局一样**，但 **图要分开传**；还要分 **白天／夜间**、**选中／没选中**。用户打开时按后台下发显示。\n\n:::ok\n**你可以这样理解：**\n\n- **现在**：顶部导航 icon／名称偏写死或难配，换图要发版。  \n- **改完后**：网站配置里有 **「顶部导航配置」** → 上传图、改名称 → H5／APP 按返回参数展示。\n- **【重要】只改「长什么样」，本需求不改「怎么用」**：本期可配的是 **icon 图 + 名称**；**不能**因配置图／名而拦点击、改跳转、影响正常使用。四格内容固定，**排序不在本功能**（另有「导航排序配置」可调 场馆B／场馆A 位置）。图／名按业务标识 **`db`／`b`／`game`／`live`／`square`** 绑定，调位也不会图错。  \n- **【重要】已展示就不换（防闪）**：四个顶栏格子 **一旦已经画出来**（常见：因接口慢先出了默认图），本页内 **不再换成后台图**，避免一闪一闪。若稍后接口成功拿到后台配置 → **只写入本地缓存，当面界面不动**。只有 **H5 刷新**，或 **切走底部 Tab 再回到本页**（APP：再进首页／杀进程重开同理），才用缓存（或再请求）展示最新图／名。日夜主题切换除外（只换已有日／夜资源）。  \n- **【重要】中国站第 4 格 · 近期另有变动（仅注明，非本期范围）**：**不在本需求里写变动内容**。做那次改版时，请核对是否动到：有／无直播双套、`live`／`square`、按账号取第 4 格皮、点击跳转、防闪／破图兜底等；有关联则在 **该改版需求** 里处理，避免和本期配置打架。无论怎么变，**图＋名仍须用本后台配置**。  \n- **前三项固定**：场馆B、场馆A、游戏（不能增删；暂不做显隐开关）。  \n- **第 4 项「直播」要分站看**：  \n  - **中国站**：账号有／无直播 → 后台 **两套配置**，但列表 **只占一行**；点【编辑】**同一页上下同时展示**「有直播配置」与「无直播配置」（名称、图各配，不分 Tab）。用户端第 4 格仍只出一格。  \n  - **展示名称、图片**：都由后台配置／接口提供，**不必写死叫什么**。  \n  - **有／无直播怎么判**：由 **账号侧既有能力判断**；本需求只约定映射（有→有直播套，无→无直播套），**不深究判定公式／字段实现**。  \n  - **越南站／国际站**：**没有**这套账号区分 → 第 4 项仍只配 **一套**。  \n- **三站都要**；各站图各自配。名称语言：**中国站中文**；**越南站越南文**（不做多语言切换）；**国际站暂定英文**。  \n- **H5＝APP 布局**；配图 **必须分端**；日夜＋选中态 → 每一配置行 **8 张图**。  \n- **读不到配置／上线还没配／破图怎么办**：网络差、接口挂、后台空配置时 → 配置 → 缓存 → **端内默认**；**不能空白、不能崩、不能裂图**。单张 CDN 破图 → **只换该态默认图**，名称尽量保留。已画出后晚到配置／好图 → **当面不闪**。默认图＝改造前写死资源，**本期不拉 UI**。  \n- **不改 PC**；不对齐「游戏类型配置」。\n:::\n\n### 改造前 → 改造后\n\n| | 改造前 | 改造后 |\n| --- | --- | --- |\n| 顶部导航 icon／名称 | 难配／偏写死 | 后台可配，端上跟配置 |\n| 点击／跳转／业务功能 | 既有交互 | **本需求不改**（只换皮）；中国站第 4 格近期另有变动见注明，**本篇不写变动内容** |\n| 后台 | 无「顶部导航配置」（底部导航管不到这一排） | 网站配置新增该菜单 |\n| H5／APP | — | 布局一致；图分端、分日夜、分选中态；**中国站第 4 格按有／无直播在「直播／广场」两套里取一套** |\n| PC | — | **不动** |\n\n### 用户端长什么样（示意）\n\n顶部一排 **四个格子**（见图「H5顶部菜单栏效果」）：图标 + 文案；选中／未选中、日间／夜间换图。  \n**【注意】中国站**：第 4 格仍只显示一格；有直播账号走 **直播** 配置套，无直播账号走 **广场** 配置套（**名称／图片均以后台接口为准**）。不是同时出两格。  \n**【注意】中国站第 4 格近期另有变动**：**本篇不写变动内容**；改版时留意与本配置逻辑是否关联。示意布局可能变，但 **icon、名称仍以后台配置为准**。\n\n:::ok\n**业务读到此处即可停。**  \n想看后台长什么样 → 参考图／交互原型。细则找研发看详版。\n:::\n\n---\n\n## 研发／测试详版（业务可跳过）\n\n:::info\n**以本篇为准**。口径：业务速览 ↔ 详版一致。\n:::\n\n## 已确认事项\n\n| 项 | 结论 |\n| --- | --- |\n| 【重要】范围 | **H5／APP／BE · 三站** 顶部导航可配置；**不含 PC**；**以本篇为准** |\n| 【重要】端 | **H5、APP、BE**；**H5 与 APP 布局一致**；**不含 PC** |\n| 【重要】站点 | **三站统一要做**：中国站、越南站、国际站 |\n| 【重要】用户端原则 | 按 **后台返回参数** 展示名称、对应端／主题／选中态 icon；**四项内容固定**，本功能 **不涉及排序**（场馆B／场馆A 顺序另有导航排序；图按 `navItemCode`） |\n| 【重要】只换皮不改功能 | 本期可配范围＝**icon 图 + 名称**。不改点击／跳转／选中；**不展示、不操作排序** |\n| 【重要】中国站第 4 格 · 近期另有变动 | **仅注明，非本期范围**：**本需求不写**该变动内容。改版时须留意是否与本配置逻辑关联（双套／`live`·`square`／取套／跳转／防闪／破图等）及可能问题；在 **对应改版需求** 处理。改版后图＋名仍须走本配置，不得写死 |\n| 【重要】读配置失败兜底 | **不能空白、不能崩、不能破图**。配置 → 缓存 → 默认；缺项只补缺项；单图失败只换该态默认图；详见「读配置失败怎么办」（含 UX／破图） |\n| 【重要】端内默认图 | **已确认**：H5／APP 改造前顶栏图／名称均为 **写死内置**，**直接作为端内默认**（三站、分端、日夜、选中／未选中；中国站含有／无直播两套对应默认）。研发把现有资源整理进默认即可。**本期默认图不拉 UI**；仅当以后要换一套新默认视觉时再请 UI |\n| 【重要】上线未配 | **允许**：上线后台暂无配置时，用户端全程走默认即可，**不强制上线前运营回填** |\n| 【重要】已展示本页不换（防闪） | **典型路径**：接口慢 → 四格先出默认图 → 稍后后台配置到了 → **写入缓存，本页界面不换**。只有 **H5 刷新** 或 **底部 Tab 切走再回来**（APP：再进首页／杀进程重开）才用缓存展示。已用缓存／配置画出后同理：本页内不因二次返回／运营刚改而跳变。**日夜切换除外** |\n| 【重要】未登录／游客 | 中国站第 4 格：按 **无直播套**（或游客默认表现，与账号侧一致即可）；本需求不另开游客配置 |\n| 【重要】中国站 · 第 4 格双套 | 列表 **合成一行**；编辑弹窗 **同页展示**有直播配置＋无直播配置。用户端按账号取一套；**有／无直播由账号侧既有能力判断，本需求不深究判定实现** |\n| 【重要】越／国际 · 第 4 项 | **无**有／无直播拆分 → 第 4 项仍 **一套** |\n| 【重要】名称语言 | **中国站**：中文；**越南站**：越南文（**不做**多语言切换）；**国际站**：**暂定英文** |\n| 后台菜单名 | **顶部导航配置**（不叫「顶部导航栏配置」） |\n| 菜单位置 | 网站配置内：在 **「导航排序配置」下方、「底部导航配置」上方**（**新开页**，不改底部导航） |\n| 【重要】权限 | 岗位权限：挂「顶部导航配置」＋子权限 **查询、修改**（**不挂新增／删除**）。系统权限：勾选菜单「顶部导航配置」即可（与系统权限既有粒度一致） |\n| 列表行（按站） | **三站均为 4 行**；中国站第 4 行＝一行双套；均 **不可增删行** |\n| 列表字段 | **名称**｜**标识**（窄列、只读业务代号）｜日夜／分端缩略图｜**编辑**；**无排序列、无有无直播列** |\n| 编辑字段 | 普通行：业务标识（只读）、名称、8 图。中国站第 4 行：live／square 两套同页；**无排序字段** |\n| 展示开关 | **暂不做** 显隐开关；用户端始终展示 4 格 |\n| 分端 | **H5／APP 必须分端上传** |\n| 日夜／选中 | 每一配置行 **8 张** 必齐才可确认 |\n| 名称／图片 | 均可后台配置；用户端只展示接口返回 |\n| 格位顺序 | **四项内容固定**；本页不排；场馆B／场馆A 展示顺序跟导航排序 |\n| 列表不要的列 | **不要**最后操作人、最后操作时间；**不要**展示开关列 |\n| 【重要】操作日志 | 修改内容写入既有 ** ；改版时核对与双套／代号／取套／跳转／防闪等是否关联 | 改版与本配置互踩、或改回写死图 | 在 **该改版需求** 里做影响分析；图＋名继续接本配置 |\n| **启动页／其它兜底图** | 另一套资源与缓存 | 缓存 key、防闪策略抄串 | 顶栏缓存键独立：建议 **顶栏＋站＋端（＋套）**；**禁止**与启动页等共用 |\n| **全局日夜主题** | 顶栏日夜图跟随 **同一套主题切换** | 顶栏日夜与底部／全局主题不一致 | 跟系统主题；不要单独一套日夜开关 |\n| **注单中心等读导航排序的页面** | 不受本期图／名影响 | 误以为改顶栏配置会改注单顺序 | 顺序只跟导航排序；本期验收不测注单顺序变更 |\n| **本页登录／登出／切号** | 跟防闪同一口径：本页已画出的第 4 格 **当面不因登录态立刻换套**；刷新／底 Tab 再回后再按新账号取套 | 缓存只按站＋端、不区分有／无直播 → 换号后仍出旧套；或登录瞬间闪换被当成 BUG | 下次进页按当前账号重取；缓存建议能区分有／无直播套（或进页重算映射）；**不要**本页热切 |\n| **老包／未接新接口的版本** | 读不到新配置 → 继续端内默认／旧写死逻辑 | 强依赖新字段导致旧版崩 | 缺字段／无接口当「无配置」走默认，勿强制解析 |\n| **选中态（哪个格高亮）** | 选中逻辑保持改造前；本期只换选中／未选中两套图 | 把「选中」和「排序下标」绑死 → 排序后高亮错格 | 选中跟路由／业务入口／**navItemCode**，不跟配置数组下标 |\n\n### E. 业务标识（【重要】· 防其它功能调位后图错）\n\n:::critical\n**本需求不涉及调换位置**（不做、不改「导航排序」）。另有功能可调 **场馆B ↔ 场馆A** 展示顺序。本期只配图／名，必须挂在 **固定业务标识** 上，**不能**挂在「第 1 格／第 2 格」下标上，否则别人一调位就会图错。\n:::\n\n| 业务项 | 已确认标识 `navItemCode` | 谁管顺序（非本期） | 谁管图／名（本期） | 备注 |\n| --- | --- | --- | --- | --- |\n| 场馆B | **`db`** | 导航排序等既有能力 | 顶部导航配置 | 与导航排序里的「场馆B」同一业务项 |\n| 场馆A | **`b`** | 导航排序等既有能力 | 顶部导航配置 | 与导航排序里的「场馆A」同一业务项 |\n| 游戏 | **`game`** | 既有位置（本期不调） | 顶部导航配置 | — |\n| 第 4 格 · 有直播（中国站） | **`live`** | 既有位置（本期不调） | 顶部导航配置 · 有直播套 | 有直播账号取此套 |\n| 第 4 格 · 无直播（中国站） | **`square`** | 同上 | 顶部导航配置 · 无直播套 | 无直播／游客取此套 |\n| 第 4 格（越南站／国际站） | **`live`** | 同上 | 顶部导航配置 · 单套 | 越／国际不拆 square |\n\n:::ok\n**用户端贴皮（本期只做这一层）：**\n\n1. **顺序**：沿用既有展示顺序（导航排序等），**本需求不负责、不改造顺序逻辑**。  \n2. **皮肤**：向顶部导航配置按 `navItemCode` 取名称＋图（失败则端内默认，默认也按同一代号）。  \n3. **贴法**：无论当前格子排在第几，用该格业务项的代号取皮；**禁止** `icons[0]`、`icons[1]` 按下标对图。\n:::\n\n:::info\n标识字符串（`db`／`b`／…）产品含义已定；若联调时后端已有等价枚举（如 `DB_SPORT`），**可映射成上表，但必须一一对应、全端统一**，不能一边按下标一边按代号。\n:::\n\n## 逻辑总览\n\n```\n运营：网站配置 → 顶部导航配置 → 选站点\n        → 中国站：第 4 项列表一行；编辑同页配「有直播」＋「无直播」两套（各名称＋各 8 张）\n        → 越／国际：第 4 项单套（名称＋8 张）\n        → 前三项 场馆B／场馆A／游戏：各名称＋各 8 张\n        → 【本页不管顺序／调位】\n用户：打开 H5／APP\n        → 请求当前站「顶部导航配置」（按 navItemCode：db／b／game／live／square）\n        → 展示顺序：沿用既有能力（如导航排序），本期不改\n        → 第 4 格皮肤：\n              · 中国站 → 有直播？→ code=live；否则 → code=square\n              · 越／国际 → code=live（单套）\n        → 每一格：按自身 navItemCode 取名称＋图（成功写缓存；失败用缓存／默认）\n        → 【禁止】按下标 icons[i] 对图（避免与既有调位能力打架）\n```\n\n## 术语\n\n| 词 | 含义 |\n| --- | --- |\n| 顶部导航 | H5／APP 首页顶部 **4 个格子**：场馆B、场馆A、游戏、第 4 格 |\n| **业务标识（navItemCode）** | 每一项的 **固定代号**，不随展示位置变化。图／名按此代号绑定；**导航排序只改顺序，不改代号** |\n| 配置类型 · 直播／广场 | **仅中国站**两套配置位，用来区分有直播／无直播账号场景；列表靠 **类型** 区分即可。用户看到的名称、图片都后台可配，**名称文案不绑死** |\n| 分端 | H5 与 APP 各自上传／各自下发，布局一致、资源独立 |\n| 8 张图 | **每一配置行**：H5 日间未选／选 + H5 夜间未选／选 + APP 日间未选／选 + APP 夜间未选／选 |\n| 改造前 | 上线前该顶部导航的写死或旧逻辑展示 |\n\n## 需求说明\n\n### 核心规则\n\n| # | 规则 | 说明 |\n| --- | --- | --- |\n| 1 | 【重要】菜单 | 网站配置 **新开** **顶部导航配置**；位置在导航排序与底部导航之间（**不改**底部导航页） |\n| 1b | 【重要】权限 | 岗位：查询＋修改（不挂新增／删除）。系统权限：勾选「顶部导航配置」菜单项即可 |\n| 2 | 【重要】三站 | 中国站／越南站／国际站均需配置；切 Tab 换该站数据 |\n| 2b | 【重要】名称语言 | 中国站中文；越南站越南文（无多语言切换）；国际站暂定英文 |\n| 3 | 【重要】列表行 | **三站均 4 行**：DB、B、游戏、第 4 项。中国站第 4 行＝一行双套；越／国际第 4 项单套。不可增删 |\n| 3b | 【重要】中国站双套编辑 | **不拆成两行、不分 Tab**。同页配有直播／无直播。映射：账号有直播→有直播套，无→无直播套；**判定沿用账号侧既有能力，本需求不深究怎么算** |\n| 3c | 【重要】越／国际 | **不拆**有／无直播；第 4 项一套 |\n| 3d | 【重要】未登录 | 游客／未登录：第 4 格按无直播套（或游客默认表现） |\n| 4 | 【重要】列表列 | 名称｜**标识（窄列，只读 navItemCode）**｜H5／APP 日夜缩略图｜编辑；**无「有无直播」列、无「排序」列** |\n| 5 | 【重要】行数与顺序 | 固定四位，**不可增删行**；排序不在本页 |\n| 6 | 【重要】编辑弹窗 | 普通行：业务标识（只读）、名称、8 图。中国站第 4 行：live／square 两套各名称＋图；**无排序字段** |\n| 6b | 【重要】不要的列 | 无最后操作人、最后操作时间、展示开关 |\n| 6c | 【重要】操作日志 | 改图／改名等保存行为写入既有 **操作日志**，修改内容在日志中体现；**不在本列表展示操作人／时间** |\n| 7 | 【重要】确认门禁 | **普通行**：8 张齐才可确认。**中国站第 4 行双套**：有直播 8 张＋无直播 8 张（共 16）**均齐**才可确认；缺任一拦截 |\n| 8 | 【重要】分端分主题 | 禁止 H5／APP 共用一套；禁止日夜共用一套 |\n| 9 | 【重要】图片 | 仅 jpg／png；建议 72×72、≤200KB；尺寸不符 **不拦截**；\u003e200KB 仅建议提示不阻断 |\n| 10 | 【重要】上传失败 | 提示「上传失败：…」；**原图不变** |\n| 11 | 【重要】用户端 | 名称／icon 用返回值；按 **navItemCode** 绑图；中国站第 4 格按账号取 live／square；**本需求不改顺序**；与既有调位共存时 **不按下标对图** |\n| 11a | 【重要】业务标识 | 固定代号：`db`／`b`／`game`／`live`／`square`（见边界表 E）；后台列表窄列展示、不可改；展示名可配但不替代代号；**禁止按下标对图**（见「实现必盯」） |\n| 11a2 | 【重要】名称长度 | 与 **底部导航配置** 名称输入框规则对齐（上限／校验风格一致即可） |\n| 11b | 【重要】只换皮（本需求） | 可配＝图＋名；不得因配置／兜底拦点击或改跳转 |\n| 11c | 【重要】中国站第 4 格近期另有变动 | **仅注明**：本需求 **不写**变动内容；改版时留意与本配置逻辑是否关联及风险；图＋名仍读本后台配置 |\n| 12 | 【重要】读配置失败兜底 | 见「用户端 · 读配置失败怎么办」；禁止空白／崩溃／**破图（裂图）**；缺项补缺项 |\n| 12a | 【重要】端内默认图 | **已确认有现成**：改造前写死的图／名 → 直接作默认内置（无配置／失败／破图共用）；**本期不拉 UI** |\n| 12a2 | 【重要】上线未配 | **走默认即可**，不强制上线前运营回填 |\n| 12b | 【重要】已展示本页不换 | **先默认后到配置**：配置写入缓存，**当面四格不换**；破图换默认后 URL 晚好也 **本页不闪回**；**H5 刷新**／**底 Tab 再回**／**APP 再进首页**后才用缓存。日夜切换除外 |\n| 12c | 【重要】破图 | CDN／损坏／空 URL 等 → **同代号默认图**替换；禁止裂图、空框、布局塌陷；名称有则保留 |\n| 13 | 【重要】布局 | H5／APP 始终 **4 格**；不因双套变成 5 格 |\n| 14 | 取消 | 编辑后取消 → 列表保持原数据 |\n| 15 | 不对齐游戏类型 | 不做游戏类型那套列表／编辑页 |\n\n### 用户端 · 读配置失败怎么办（【重要】）\n\n:::critical\n拉后台配置 **一定会遇到**：弱网、超时、接口 5xx、返回空／缺字段、解析失败、图片 CDN 挂、**破图**等。产品口径必须先定死，避免研发各端各做一套。  \n**总原则**：顶栏 **始终 4 格可点**；**不空白、不破图、不崩、不堵死弹窗、不因兜底改跳转**；体验上尽量 **静默、不闪、不跳布局**。\n:::\n\n#### 1）配置数据从哪来（优先级）\n\n| 优先级 | 何时用 | 展示什么 | 用户侧体感 |\n| --- | --- | --- | --- |\n| 1 | 本次拉配置 **成功**，且本页顶栏 **尚未画出** | 用本次返回渲染四格；并 **写入本地缓存**（键见实现必盯） | 正常看到后台图／名 |\n| 1b | 本次拉配置 **成功**，但本页顶栏 **已经用默认／旧图画出** | **只写／覆盖缓存，本页界面不换**（防闪）；刷新或底 Tab 再进后再用缓存 | **当面不闪换**；再进页才变新 |\n| 2 | 本次拉配置 **失败**，但本地有上次成功缓存 | 用 **缓存** 渲染 | 仍有完整顶栏；可能略旧于后台，可接受 |\n| 3 | 失败且 **无缓存**，或后台 **无有效配置**（含上线未配） | 用 **端内默认** 画出四格（中国站第 4 格按有／无直播用对应默认） | 看起来像改造前写死顶栏；功能正常 |\n| 4 | 配置／缓存已有，但 **某张 icon 图加载失败（破图）** | 见下节「破图／单图失败」 | **禁止出现裂图／空白方块** |\n\n#### 2）接口／数据类失败（怎么判、怎么应对）\n\n| 场景 | 判定示例 | 应对 | UX 要求 |\n| --- | --- | --- | --- |\n| 弱网／超时 | 请求超时、长时间无响应 | 有限重试后 → 缓存 → 默认；**不堵首屏** | 顶栏尽快用缓存／默认画出，其它模块照常加载 |\n| 接口 4xx／5xx／网络断 | HTTP 失败、无网 | 同上 | **不弹**必须点掉才能进首页的错误框；不 Toast 打断 |\n| 返回空／全空数组 | body 空、无四项 | 当「无有效配置」→ 缓存 → 默认 | 四格仍在，用默认名＋默认图 |\n| 缺字段／少一项 | 缺某 `navItemCode`、缺名称或某态 URL | **缺哪项补哪项默认**；已有项尽量用返回值 | 不要整排回退成默认（避免「一个字段坏全盘默认」） |\n| 解析失败／结构异常 | JSON 坏、类型错 | 当失败 → 缓存 → 默认 | 不崩、不白屏 |\n| 缓存损坏／读不出 | 本地反序列化失败 | 清该缓存键，当无缓存 → 默认 | 静默；下次成功再写缓存 |\n| 老包无新接口 | 无接口／缺字段 | 当无配置 → 端内默认／旧写死 | 不因强解析新字段崩溃 |\n| 上线后台未配 | 运营尚未保存有效配置 | 走默认（有缓存仍优先缓存） | 允许；不强制上线前回填 |\n| 中国站只配一套 | 仅 live 或仅 square 有效 | 缺的那套账号类型走默认；已配套照常 | 一类账号正常、一类像改造前 |\n\n#### 3）破图／图片加载失败（【重要】· 用户最容易感知）\n\n:::warn\n**破图**＝ CDN 404、加载超时、图片损坏、非图内容、跨域失败、URL 空字符串等，导致 `\u003cimg\u003e` 失败或画不出。  \n**禁止**：浏览器默认裂图图标、灰色空框、图标位塌成 0 高、整格空白。\n:::\n\n| 场景 | 应对 | UX 要求 |\n| --- | --- | --- |\n| **单张**配置／缓存 URL 加载失败 | **仅该格、该端、该主题、该选中态** 换用 **端内默认图**；名称若已有配置文案则 **仍用配置名称** | 其它格不受影响；格子尺寸不变、不跳布局 |\n| **某一格多态**（如仅夜间选中）挂了 | 只换挂掉的那一态默认图；日间／未选中仍用配置 | 切日夜／点选中时，失败态也不破图 |\n| **四格图全部** CDN 挂 | 四格图都走默认；名称能取配置则取配置 | 顶栏仍完整可点，像写死默认 |\n| **有 URL 但图极慢** | 允许先显示默认图占位，或保持上一帧；**不要**长时间空白等图 | 首屏顶栏 **尽快有图**；慢图回来若本页已画出 → **本页不闪换**（写入策略同防闪，再进页可用） |\n| **名称有、图无／图挂** | 名称用配置；图用默认 | 文案对、图标不破 |\n| **图有、名称为空／缺** | 图用配置；名称用该 `navItemCode` 的 **端内默认名** | 不出现「有图无字」或空白文案 |\n| **破图后 URL 重试成功** | **本页内不跳变回配置图**（与防闪一致）；刷新／底 Tab 再进后再用 | 避免裂图→默认→再闪成配置图 |\n| **默认图自身缺失（研发事故）** | 须上线前保证默认资源打进包；验收卡死 | 若极端缺失：至少保留文字名称＋可点热区，**仍禁止裂图占位** |\n\n:::ok\n**破图处理一句话**：失败就换 **同代号端内默认图**，保格子、保可点、保不裂；**不要**让用户看到破图。\n:::\n\n#### 4）用户体验总约束（读配置／破图共用）\n\n| # | 约束 | 说明 |\n| --- | --- | --- |\n| U1 | **静默兜底** | 读配置失败、破图兜底 **不**弹堵死框；不因顶栏失败打断进首页 |\n| U2 | **始终 4 格** | 布局不因失败变成 3／5 格或高度塌陷 |\n| U3 | **可点可跳** | 配置／缓存／默认／破图兜底时，点击、跳转、选中逻辑 **与改造前一致** |\n| U4 | **不闪不跳** | 已画出后本页不因晚到配置／晚到好图而闪换（日夜切换除外） |\n| U5 | **尽快有内容** | 弱网时优先用缓存或默认 **尽快画出**，避免顶栏长时间空洞 |\n| U6 | **日夜／选中仍可用** | 走默认时也要有日夜、选中／未选中对应默认图，切换主题不破图 |\n| U7 | **不阻塞首屏** | 顶栏配置请求失败不拖死首页其它模块 |\n| U8 | **与启动页隔离** | 缓存键、防闪策略不与启动页兜底图串用 |\n\n| 补充约定 | 说明 |\n| --- | --- |\n| 有／无直播判定 | **由账号侧既有能力判断**；本需求只写映射，**不展开判定字段／公式** |\n| 与「上传失败」区别 | 上表管 **用户端读配置／破图**；运营后台上传失败仍见「上传失败文案」节 |\n\n### 端内默认图（【重要】）\n\n:::ok\n**已确认**：当前 H5／APP 顶栏 **图和名称都是写死的**，包内 **已有现成资源** → **直接当作端内默认**，研发整理内置即可。**本期默认图不需要拉 UI**（对齐「先对包里有没有现成图；没有再拉 UI」——现已确认有）。  \n默认资源同时服务：**无配置、接口失败、缓存没有、破图替换**。\n:::\n\n| 项 | 说明 |\n| --- | --- |\n| 要什么 | H5／APP 包内自带默认 **图＋名称**，覆盖：三站、分端、日夜、选中／未选中；中国站第 4 格还要有有直播／无直播两套默认 |\n| 来源（已确认） | **改造前已写死在用的切图／文案**；H5／APP 研发收成「无配置／失败／破图」兜底路径 |\n| 要不要 UI | **本期默认图：不需要 UI**。仅当以后要换一套 **新默认视觉** 时，再请 UI 出资源（72×72、日夜／选中态；非整页改版） |\n| 上线策略 | 后台可以先空着；用户端走上述默认。运营后续配好后，用户刷新／底 Tab 再进即可看到配置图 |\n| 破图时 | 用 **同 navItemCode、同端、同主题、同选中态** 的默认图替换；名称优先保留配置文案 |\n\n:::key\n【注意】主口径两句：  \n1）**配置链路**：成功用配置 → 失败用缓存 → 再无用默认。  \n2）**体验链路**：先画出（缓存／默认）→ 晚到只进缓存当面不换 → **破图立刻换默认、禁止裂图** → 刷新／底 Tab 再回才用最新缓存。\n:::\n\n### 上传失败文案\n\n| 场景 | 提醒 |\n| --- | --- |\n| 格式非 jpg／png | 上传失败：仅支持 jpg、png 格式 |\n| 图片损坏读不出 | 上传失败：图片读取失败，请重试 |\n| 接口／网络失败 | 上传失败，请稍后重试 |\n| 超过 200KB | 图片超过 200KB，建议压缩后上传（**不拦截**） |\n| 八张／双套未齐仍确认 | 普通行：请分端、分主题上传完整图标；双套：有直播与无直播两套均须配齐 |\n| 名称为空 | 拦截（文案与后台既有表单校验风格一致即可） |\n\n### 用户端取值\n\n| 端 × 主题 | 使用图 |\n| --- | --- |\n| H5 日间 | H5 日间 · 选中／未选中 |\n| H5 夜间 | H5 夜间 · 选中／未选中 |\n| APP 日间 | APP 日间 · 选中／未选中 |\n| APP 夜间 | APP 夜间 · 选中／未选中 |\n\n## 参考界面（可选扫一眼）\n\n### 完成后效果 · 可交互原型（【重要】· 已拆分 · 可点击）\n\n:::warn\n**【注意】原型已拆成三页**，勿再合成一页。配置页展示 **业务标识**；用户端可 **模拟**既有导航排序调 场馆B／场馆A（仅演示共存，**非本需求功能**），验证图跟代号、不跟位置。  \n1）**后台配置** 2）**权限** 3）**用户端（H5＋APP 一套）**。  \n静态截图不算原型。产品效果以三份交互原型＋本文为准（**非必须 UI 改版**）。\n:::\n\n![1 · 后台配置（可交互）](./原型-配置.html)\n\n![2 · 权限（可交互）](./原型-权限.html)\n\n![3 · 用户端 H5＋APP（可交互）](./原型-用户端.html)\n\n→ 入口也可：[原型.html](./原型.html)\n\n### 界面对照图（仅对照 · 不可当原型）\n\n:::compare\n![底部导航配置 · 列表](./对照-底部导航配置-列表.png)\n![岗位权限 · 底部导航勾选](./对照-岗位权限-底部导航勾选.png)\n:::\n\n:::compare\n![系统权限 · 创建业务系统弹窗原版](./对照-系统权限-创建业务系统弹窗-原版.png)\n![系统权限 · 勾选示意](./对照-系统权限-勾选示意.png)\n:::\n\n:::compare\n![H5 顶部菜单栏效果](./H5顶部菜单栏效果.png)\n![操作日志 · 对照](./对照-操作日志.png)\n:::\n\n## 异常\n\n| 场景 | 处理 |\n| --- | --- |\n| 上传格式错误／损坏／网络失败 | 见上传失败文案；原图不变 |\n| 尺寸非 72×72 | 不拦截，直接采用 |\n| \u003e200KB | 建议提示，不阻断 |\n| 八张／双套未齐点确认 | 拦截（普通行 8；双套 16） |\n| 名称为空 | 拦截 |\n| 编辑后取消 | 不落库 |\n| 用户端无配置／失败／老包 | 见「读配置失败怎么办」：缓存 → 默认；不崩、不堵死、不破图 |\n| 配置成功但单图 URL 挂／破图 | 该格该态默认图；名称尽量保留；禁止裂图；本页不因重试成功闪回 |\n| 缺某一 navItemCode／缺名称 | 只补缺项默认；其余项继续用配置 |\n| 弱网配置晚到 | 先缓存／默认画出；晚到只写缓存当面不换 |\n| 透明 png 夜间发白 | 风险：建议透明底；夜间走查 |\n\n## 验收标准\n\n:::critical\n【必验】未勾选不得视为完成。三站、H5／APP 分端、日夜选中态均需覆盖。\n:::\n\n- [ ] 【必验】网站配置出现 **顶部导航配置**，位于导航排序与底部导航之间（新开页）  \n- [ ] 【必验】岗位权限、系统权限均可勾选「顶部导航配置」（子权限含 **查询、修改**；**无**新增／删除）  \n- [ ] 【必验】三站 Tab 均可进入；**三站列表均为 4 行**；中国站第 4 行＝一行双套  \n- [       function renderMarkdownImage(alt, srcPath, assetBase) {
        const base = assetBase ? assetBase.replace(/\\/g, '/').replace(/\/?$/, '/') : ''
        if (!/^(https?:|data:)/i.test(srcPath) && !srcPath.startsWith('./') && !srcPath.startsWith('/')) {
          srcPath = base + srcPath
        } else if (srcPath.startsWith('./')) {
          const rest = srcPath.slice(2)
          const baseNoDot = base.replace(/^\.\//, '')
          srcPath = (baseNoDot && rest.startsWith(baseNoDot)) ? './' + rest : base + rest
        }
        if (/\.html?$/i.test(srcPath) || /^data:text\/html/i.test(srcPath)) {
          return (
            '<figure class="doc-proto"><iframe src="' + escapeHtml(srcPath) +
            '" title="' + escapeHtml(alt || '交互原型') +
            '" loading="lazy" scrolling="no" data-proto-frame="1"></iframe><figcaption class="cap">' +
            escapeHtml(alt || '交互原型') + '（本页内可直接操作）</figcaption></figure>'
          )
        }
        const phoneClass = isPhoneShot(alt, srcPath) ? ' is-phone' : ''
        return (
          '<figure class="doc-figure' + phoneClass + '"><img src="' + escapeHtml(srcPath) +
          '" alt="' + escapeHtml(alt) +
          '" loading="lazy" data-lightbox="1" title="点击放大查看" /><figcaption class="cap">' +
          escapeHtml(alt || '示意图') + '（点击可放大）</figcaption></figure>'
        )
      }
      function renderCompareBlock(body, assetBase) {
        const imgs = []
        const re = /!\[([^\]]*)\]\(([^)]+)\)/g
        let m
        while ((m = re.exec(body))) imgs.push(renderMarkdownImage(m[1], m[2].trim(), assetBase))
        if (!imgs.length) return renderMarkdown(body.trim(), assetBase)
        return imgs.join('')
      }
      function renderTabsBlock(body, assetBase) {
        const parts = String(body || '').trim().split(/^#{3,4}\s+/m).filter(Boolean)
        if (!parts.length) return ''
        const panes = parts.map((part) => {
          const nl = part.indexOf('\n')
          const title = (nl === -1 ? part : part.slice(0, nl)).trim()
          const rest = nl === -1 ? '' : part.slice(nl + 1)
          const imgs = renderCompareBlock(rest, assetBase)
          return { title, html: imgs ? '<div class="doc-compare">' + imgs + '</div>' : '' }
        })
        let bar = '<div class="doc-tab-bar" role="tablist">'
        let panesHtml = ''
        panes.forEach((p, i) => {
          const on = i === 0 ? ' is-on' : ''
          bar += '<button type="button" class="doc-tab-btn' + on + '" data-tab="' + i + '">' +
            escapeHtml(p.title) + '</button>'
          panesHtml += '<div class="doc-tab-pane' + on + '" data-pane="' + i + '">' + p.html + '</div>'
        })
        bar += '</div>'
        return '<div class="doc-tabs">' + bar + panesHtml + '</div>'
      }
      function renderMarkdown(src, assetBase) {
        let text = String(src || '').replace(/\r\n/g, '\n')
        const calloutStore = []
        const base = assetBase ? assetBase.replace(/\\/g, '/').replace(/\/?$/, '/') : ''
        text = text.replace(/:::(\w+)\s*\n([\s\S]*?)\n:::/g, (_, type, body) => {
          const idx = calloutStore.length
          if (type === 'compare') {
            calloutStore.push({ type: 'compare', html: renderCompareBlock(body, assetBase) })
          } else if (type === 'tabs') {
            calloutStore.push({ type: 'tabs', html: renderTabsBlock(body, assetBase) })
          } else {
            calloutStore.push({ type, html: renderMarkdown(body.trim(), assetBase) })
          }
          return '\n\n%%CALLOUT_' + idx + '%%\n\n'
        })
        const blocks = text.split(/\n{2,}/)
        const html = []
        for (let block of blocks) {
          block = block.trim()
          if (!block) continue
          const calloutRef = block.match(/^%%CALLOUT_(\d+)%%$/)
          if (calloutRef) {
            const item = calloutStore[Number(calloutRef[1])]
            if (item.type === 'compare') html.push('<div class="doc-compare">' + item.html + '</div>')
            else if (item.type === 'tabs') html.push(item.html)
            else html.push('<div class="callout callout-' + item.type + '">' + item.html + '</div>')
            continue
          }
          if (/^```/.test(block)) {
            const lines = block.split('\n')
            const code = lines.slice(1, lines[lines.length - 1] === '```' ? -1 : undefined).join('\n')
            html.push('<pre><code>' + escapeHtml(code) + '</code></pre>')
            continue
          }
          if (block.startsWith('# ')) { html.push('<h1>' + inlineFormat(block.slice(2)) + '</h1>'); continue }
          if (block.startsWith('## ')) { html.push('<h2>' + inlineFormat(block.slice(3)) + '</h2>'); continue }
          if (block.startsWith('### ')) { html.push('<h3>' + inlineFormat(block.slice(4)) + '</h3>'); continue }
          if (/^\|/.test(block) && block.includes('\n|')) {
            const rows = block.split('\n').filter((l) => /^\|/.test(l) && !/^\|\s*-+/.test(l))
            if (rows.length) {
              const parseRow = (row) =>
                row.replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim())
              const head = parseRow(rows[0])
              const isKv = head.length === 2 && head[0] === '项' && /^(内容|说明)$/.test(head[1])
              const nowrapCol = head.map((c) => /^(编号|#|日期|版本)$/.test(c))
              let table = '<table' + (isKv ? ' class="kv-table"' : '') + '><thead><tr>'
              head.forEach((c, i) => {
                table += '<th' + (nowrapCol[i] ? ' class="cell-nowrap"' : '') + '>' + inlineFormat(c) + '</th>'
              })
              table += '</tr></thead><tbody>'
              rows.slice(1).forEach((row) => {
                table += '<tr>'
                parseRow(row).forEach((c, i) => {
                  table += '<td' + (nowrapCol[i] ? ' class="cell-nowrap"' : '') + '>' + inlineFormat(c) + '</td>'
                })
                table += '</tr>'
              })
              table += '</tbody></table>'
              html.push(table)
              continue
            }
          }
          if (/^(- |\d+\. )/.test(block)) {
            const lines = block.split('\n')
            const ordered = /^\d+\. /.test(lines[0])
            const tag = ordered ? 'ol' : 'ul'
            const items = lines
              .map((line) => line.replace(/^(- |\d+\. )/, ''))
              .map((line) => '<li>' + inlineFormat(line) + '</li>')
              .join('')
            html.push('<' + tag + '>' + items + '</' + tag + '>')
            continue
          }
          if (block === '---') { html.push('<hr />'); continue }
          const linkMatch = block.match(/^\[([^\]]+)\]\(([^)]+)\)$/)
          if (linkMatch) {
            let href = linkMatch[2].trim()
            if (!/^(https?:|data:)/i.test(href) && !href.startsWith('./') && !href.startsWith('/')) href = base + href
            else if (href.startsWith('./')) {
              const rest = href.slice(2)
              const baseNoDot = base.replace(/^\.\//, '')
              href = (baseNoDot && rest.startsWith(baseNoDot)) ? './' + rest : base + rest
            }
            html.push(
              '<p><a href="' + escapeHtml(href) + '" target="_blank" rel="noopener">' +
              escapeHtml(linkMatch[1]) + '</a></p>'
            )
            continue
          }
          const imgLines = block.split('\n').map((l) => l.trim()).filter(Boolean)
          if (imgLines.length && imgLines.every((line) => /^!\[([^\]]*)\]\(([^)]+)\)$/.test(line))) {
            html.push(imgLines.map((line) => {
              const m = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/)
              return renderMarkdownImage(m[1], m[2].trim(), assetBase)
            }).join('\n'))
            continue
          }
          if (/<span class="tag/.test(block)) {
            const tags = block.replace(
              /<span class="tag([^"]*)">([\s\S]*?)<\/span>/g,
              (_, cls, label) => '<span class="tag' + cls + '">' + escapeHtml(label.trim()) + '</span>'
            )
            html.push('<div class="tag-row">' + tags.replace(/\n/g, ' ') + '</div>')
            continue
          }
          html.push(
            '<p>' + block.split('\n').map((line) => inlineFormat(line)).join('<br>') + '</p>'
          )
        }
        return html.join('\n')
      }
      function ensureLightbox() {
        let lb = document.getElementById('img-lightbox')
        if (lb) return lb
        lb = document.createElement('div')
        lb.id = 'img-lightbox'
        lb.className = 'img-lightbox'
        lb.innerHTML =
          '<img alt="" /><div class="lb-hint">滚轮持续放大/缩小 · 拖拽移动 · 点空白或 Esc 关闭</div>'
        document.body.appendChild(lb)
        const lbImg = lb.querySelector('img')
        let scale = 1
        let tx = 0
        let ty = 0
        let dragging = false
        let lastX = 0
        let lastY = 0

        function applyTransform() {
          lbImg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'
        }
        function resetView() {
          scale = 1
          tx = 0
          ty = 0
          dragging = false
          lb.classList.remove('is-dragging')
          applyTransform()
        }
        const close = () => {
          lb.classList.remove('is-open')
          resetView()
        }
        lb.addEventListener('click', (e) => {
          if (e.target === lb || e.target.classList.contains('lb-hint')) close()
        })
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && lb.classList.contains('is-open')) close()
        })
        lb.addEventListener(
          'wheel',
          (e) => {
            if (!lb.classList.contains('is-open')) return
            e.preventDefault()
            const rect = lbImg.getBoundingClientRect()
            const ox = (e.clientX - (rect.left + rect.width / 2)) / scale
            const oy = (e.clientY - (rect.top + rect.height / 2)) / scale
            const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12
            const next = Math.min(8, Math.max(0.5, scale * factor))
            if (next === scale) return
            tx += ox * (scale - next)
            ty += oy * (scale - next)
            scale = next
            applyTransform()
          },
          { passive: false },
        )
        lbImg.addEventListener('pointerdown', (e) => {
          if (!lb.classList.contains('is-open') || e.button !== 0) return
          dragging = true
          lastX = e.clientX
          lastY = e.clientY
          lb.classList.add('is-dragging')
          try { lbImg.setPointerCapture(e.pointerId) } catch (_) {}
          e.preventDefault()
        })
        lbImg.addEventListener('pointermove', (e) => {
          if (!dragging) return
          tx += e.clientX - lastX
          ty += e.clientY - lastY
          lastX = e.clientX
          lastY = e.clientY
          applyTransform()
        })
        const endDrag = (e) => {
          if (!dragging) return
          dragging = false
          lb.classList.remove('is-dragging')
          try { lbImg.releasePointerCapture(e.pointerId) } catch (_) {}
        }
        lbImg.addEventListener('pointerup', endDrag)
        lbImg.addEventListener('pointercancel', endDrag)
        lbImg.addEventListener('click', (e) => e.stopPropagation())
        lb._resetView = resetView
        return lb
      }
      function markPhoneFigures(root) {
        root.querySelectorAll('.doc-figure:not(.is-phone) img[data-lightbox]').forEach((img) => {
          const apply = () => {
            if (!img.naturalWidth) return
            // 竖屏（高明显大于宽）按手机尺寸收窄
            if (img.naturalHeight > img.naturalWidth * 1.15) {
              const fig = img.closest('.doc-figure')
              if (fig && !fig.closest('.doc-compare')) fig.classList.add('is-phone')
            }
          }
          if (img.complete) apply()
          else img.addEventListener('load', apply)
        })
      }
      function bindProtoFrameResize(root) {
        window.addEventListener('message', (e) => {
          const data = e && e.data
          if (!data || data.type !== 'proto-resize') return
          const h = Number(data.height)
          if (!h || h < 100) return
          root.querySelectorAll('iframe[data-proto-frame]').forEach((frame) => {
            try {
              if (frame.contentWindow === e.source) {
                frame.style.height = Math.ceil(h) + 'px'
              }
            } catch (_) { /* ignore */ }
          })
        })
      }
      function bindDocImageLightbox(root) {
        const lb = ensureLightbox()
        const lbImg = lb.querySelector('img')
        root.querySelectorAll('img[data-lightbox]').forEach((img) => {
          img.addEventListener('click', () => {
            if (typeof lb._resetView === 'function') lb._resetView()
            lbImg.src = img.currentSrc || img.src
            lbImg.alt = img.alt || ''
            lb.classList.add('is-open')
          })
        })
        markPhoneFigures(root)
        bindProtoFrameResize(root)
        bindDocTabs(root)
      }
      function bindDocTabs(root) {
        root.querySelectorAll('.doc-tabs').forEach((wrap) => {
          wrap.querySelectorAll('.doc-tab-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
              const i = btn.getAttribute('data-tab')
              wrap.querySelectorAll('.doc-tab-btn').forEach((b) => b.classList.toggle('is-on', b === btn))
              wrap.querySelectorAll('.doc-tab-pane').forEach((p) => p.classList.toggle('is-on', p.getAttribute('data-pane') === i))
            })
          })
        })
      }
      function mountDocToc(root) {
        const box = document.getElementById('docToc')
        const panel = document.getElementById('docTocPanel')
        if (!box || !panel) return
        const used = Object.create(null)
        const items = []
        root.querySelectorAll('h2, h3').forEach((el) => {
          const text = String(el.textContent || '').replace(/\s+/g, ' ').trim()
          if (!text) return
          let base = 'sec-' + text.replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fff\-]/g, '')
          if (base === 'sec-') base = 'sec'
          let id = base
          let n = 2
          while (used[id]) { id = base + '-' + n; n++ }
          used[id] = true
          el.id = id
          items.push({ id: id, text: text, level: el.tagName === 'H3' ? 3 : 2 })
        })
        if (!items.length) {
          box.hidden = true
          panel.innerHTML = ''
          return
        }
        box.hidden = false
        panel.innerHTML = items.map(function (it) {
          return '<a class="toc-l' + it.level + '" href="#' + it.id + '" title="' + escapeHtml(it.text) + '">' + escapeHtml(it.text) + '</a>'
        }).join('')
        const links = panel.querySelectorAll('a')
        links.forEach(function (a) {
          a.addEventListener('click', function (e) {
            e.preventDefault()
            const target = document.getElementById(a.getAttribute('href').slice(1))
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' })
          })
        })
        function syncActive() {
          let current = items[0] && items[0].id
          items.forEach(function (it) {
            const el = document.getElementById(it.id)
            if (el && el.getBoundingClientRect().top <= 72) current = it.id
          })
          links.forEach(function (a) {
            a.classList.toggle('is-active', a.getAttribute('href') === '#' + current)
          })
        }
        window.addEventListener('scroll', syncActive, { passive: true })
        syncActive()
      }

      // 文档刷新：停留在刚才阅读位置（不置顶）。原型.html 单独打开时自行置顶，与文档分开。
      const DOC_SCROLL_KEY = 'doc-local-scroll:' + location.pathname
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      let savedScroll = 0
      try { savedScroll = Number(sessionStorage.getItem(DOC_SCROLL_KEY) || 0) || 0 } catch (_) {}
      function saveDocScroll() {
        try { sessionStorage.setItem(DOC_SCROLL_KEY, String(window.scrollY || 0)) } catch (_) {}
      }
      function restoreDocScroll() {
        const y = Math.max(0, savedScroll)
        const apply = () => window.scrollTo(0, y)
        apply()
        requestAnimationFrame(apply)
        setTimeout(apply, 80)
        setTimeout(apply, 320)
      }
      let scrollTimer = null
      window.addEventListener('scroll', () => {
        if (scrollTimer) clearTimeout(scrollTimer)
        scrollTimer = setTimeout(saveDocScroll, 120)
      }, { passive: true })
      window.addEventListener('beforeunload', saveDocScroll)

      const page = window.DOC_PAGE || {}
      const bodyEl = document.getElementById('body')
      bodyEl.innerHTML = renderMarkdown(page.text || '', './')
      bindDocImageLightbox(bodyEl)
      mountDocToc(bodyEl)
      restoreDocScroll()
    })()
  </script>
</body>
</html>
