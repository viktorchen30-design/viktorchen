    window.DOC_PAGE = {"title":"【BE／H5／PC】【中国站】【直播】三端主播直播，显示人气值优化","text":"# 【BE/H5/PC】【中国站】【直播】三端主播直播，显示人气值优化\r\n\r\n\u003cspan class=\"tag tag-be\"\u003eBE\u003c/span\u003e\r\n\u003cspan class=\"tag tag-fe\"\u003eH5\u003c/span\u003e\r\n\u003cspan class=\"tag tag-fe\"\u003ePC\u003c/span\u003e\r\n\u003cspan class=\"tag tag-site\"\u003e中国站\u003c/span\u003e\r\n\u003cspan class=\"tag tag-mod\"\u003e直播 · 主播管理\u003c/span\u003e\r\n\u003cspan class=\"tag tag-pri\"\u003e人气值加成\u003c/span\u003e\r\n\r\n:::lead\r\n中国站后台 **直播管理 → 主播管理**：① 查询区增加 **「启动人气值加成 / 人气值加成启动中」** 同一按钮（**可开可关**）；② **去掉「虚拟粉丝数」**——列表列 **和** 新增/编辑表单字段都不要。  \r\n人气加成开启后，每天 **北京时间 01:00** 按当时人气值随机上浮 **1%～2%**（小数向上取整）。**手动改人气** 以改完后的数为准。  \r\n**H5 / PC 人气值展示位置均已补图**（H5 含 **热门主播** + **主播排行**）；**APP 调 H5，不做单独调整**；发布时间 **0904**。\r\n:::\r\n\r\n:::info\r\n**一句话**：主播管理加人气加成开关（可关）；列表与新增/编辑都去掉虚拟粉丝数；开着时每天凌晨 1 点按当前人气涨 1%～2%（向上取整）；0904 发版。\r\n:::\r\n\r\n:::ok\r\n### 说明（范围一句话）\r\n**【重要】本期**：后台主播管理 **按钮（可开可关）+ 去掉虚拟粉丝数（列表列 + 新增/编辑字段）+ 加成脚本**；H5/PC 展示位置已补；APP 调 H5 不单改。发布时间 **0904**。\r\n:::\r\n\r\n## 已确认事项\r\n\r\n| 项 | 结论 |\r\n| --- | --- |\r\n| 站点 | **中国站** |\r\n| 后台入口 | **直播管理 → 主播管理** |\r\n| 改动 1 | 查询区「新增」旁增加按钮：**启动人气值加成** / **人气值加成启动中**（同一按钮两种状态文案） |\r\n| 按钮开关 | **可以关闭**：启动中再点 → 关闭加成，文案回到「启动人气值加成」 |\r\n| 改动 2 | **去掉「虚拟粉丝数」**：① 列表不再显示该列；② **新增 / 编辑** 弹窗不再显示、不可填写该字段 |\r\n| 加成时刻 | 每天 **北京时间 01:00** 跑脚本 |\r\n| 加成幅度 | 相对脚本运行时读到的人气值，随机 **1%～2%** |\r\n| 取整 | 有小数则 **向上取整**（如 202.6 → 203） |\r\n| 手动改人气 | 以最新手改为准；跑前改 → 按新数加成；跑后改 → 直接展示手改值 |\r\n| 加成范围 | **列表全部主播**（开启后脚本对全部主播跑加成，不是勾选部分） |\r\n| H5 | **已补两处**：① 直播 → **热门主播** 卡片（昵称下火焰+数字）；② **主播排行**（Top3 昵称下 / 列表昵称旁，火焰+「人气」+数值） |\r\n| PC | **已补**：直播页两处 — ① 主播列表缩略卡；② 播放器上方主播信息，均为 **火焰 + 数字**（可显示如 1.5w） |\r\n| APP | **调用 H5 页面，不做单独调整** |\r\n| 负责人 | Viktor |\r\n| 发布时间 | **0904**（2026-09-04） |\r\n| 状态 | **调整完成** |\r\n\r\n## 基本信息\r\n\r\n| 项 | 内容 |\r\n| --- | --- |\r\n| 需求名称 | 【BE/H5/PC】【中国站】【直播】三端主播直播，显示人气值优化 |\r\n| 端 | **BE**（本期已明确）；**H5 / PC**（展示位置已补）；**APP 调 H5，不单改** |\r\n| 站点 | **中国站** |\r\n| 模块 | 直播管理 · 主播管理 · 人气值 |\r\n| 入口 | 运营后台 → 直播管理 → **主播管理** |\r\n| 负责人 | Viktor |\r\n| 协作 | 后台前端、后端（定时脚本）、测试 |\r\n| 状态 | **调整完成** |\r\n| 发布时间 | **2026-09-04**（0904 版本） |\r\n\r\n## 交付物\r\n\r\n| 页 | 用途 |\r\n| --- | --- |\r\n| [需求说明.md](./需求说明.md) | 需求正文 |\r\n| [原型.html](./原型.html) | 主播管理交互示意（加成按钮；列表/新增编辑去字段） |\r\n| [对照-0-主播管理现状.png](./对照-0-主播管理现状.png) | 现网主播管理（对照基准） |\r\n| [对照-1-列表去掉虚拟粉丝数.png](./对照-1-列表去掉虚拟粉丝数.png) | 列表：红框标出去掉「虚拟粉丝数」列 |\r\n| [对照-2-新增编辑去掉虚拟粉丝数.png](./对照-2-新增编辑去掉虚拟粉丝数.png) | 新增/编辑：红框标出去掉「虚拟粉丝数」字段 |\r\n| [H5-人气值展示位置.png](./H5-人气值展示位置.png) | H5 热门主播卡片人气值位置（火焰旁数字） |\r\n| [H5-主播排行-人气值展示位置.png](./H5-主播排行-人气值展示位置.png) | H5 主播排行人气值位置（Top3 + 列表） |\r\n| [PC-人气值展示位置.png](./PC-人气值展示位置.png) | PC 直播页人气值位置（列表卡 + 播放器上方，共两处） |\r\n| [index.html](./index.html) | 本地入口 |\r\n\r\n## 参考界面（现状 + 改动 · 一屏对照）\r\n\r\n:::info\r\n三图同屏：① **现状**；② 列表去掉「虚拟粉丝数」列；③ 新增/编辑去掉同名字段。缩略展示，**点击可放大**。\r\n:::\r\n\r\n:::compare\r\n![① 现状 · 主播管理](./对照-0-主播管理现状.png)\r\n\r\n![② 列表 · 去掉虚拟粉丝数列](./对照-1-列表去掉虚拟粉丝数.png)\r\n\r\n![③ 新增/编辑 · 去掉虚拟粉丝数字段](./对照-2-新增编辑去掉虚拟粉丝数.png)\r\n:::\r\n\r\n### 完成后效果示意（交互原型 · 非终稿）\r\n\r\n:::info\r\n点「新增 / 编辑」看表单红框；可切换人气加成。非 UI 终稿。三图对照见上方（勿重复铺大图）。\r\n:::\r\n\r\n![主播管理 · 人气加成效果示意](./原型.html)\r\n\r\n### H5 · 人气值展示位置（已补）\r\n\r\n:::ok\r\n**【重要】** 用户端 H5 人气值均为 **火焰图标 + 数值**（可带「人气」文案 / 如 **2.6W**），跟随后台「人气值」字段；加成后数字会变。本期已补 **两处页面**：\r\n\r\n| # | 页面 | 位置 |\r\n| --- | --- | --- |\r\n| 1 | **直播 → 热门主播** 卡片 | 主播昵称下方：**火焰 + 数字** |\r\n| 2 | **主播 → 主播排行** | ① Top1～3：昵称下方 **火焰 +「人气」+ 数值**；② 排行列表（如 4 名及以后）：昵称旁 **火焰 +「人气」+ 数值** |\r\n\r\n旁侧人物图标等其他数字 **不是** 本期后台去掉的「虚拟粉丝数」。  \r\n**APP 调同一 H5，不单改。**\r\n:::\r\n\r\n:::compare\r\n![H5 · 热门主播 · 人气值展示位置](./H5-人气值展示位置.png)\r\n\r\n![H5 · 主播排行 · 人气值展示位置](./H5-主播排行-人气值展示位置.png)\r\n:::\r\n\r\n### PC · 人气值展示位置（已补）\r\n\r\n:::ok\r\n**【重要】** 用户端 PC **直播** 页，人气值同样是 **火焰图标 + 数字**（可缩写如 **1.5w**），跟随后台人气字段。图中红框两处：\r\n\r\n1. **主播列表缩略卡**（上方横滑列表，昵称下方）  \r\n2. **播放器区域上方** 当前主播信息（头像旁昵称右侧）\r\n\r\n两处均为同一人气值展示，加成后数字同步变化。一般无单独 UI 改版。\r\n:::\r\n\r\n![PC · 人气值展示位置](./PC-人气值展示位置.png)\r\n\r\n## 背景与目标\r\n\r\n| 现状 | 目标 |\r\n| --- | --- |\r\n| 主播管理有查询 / 重置 / 新增，无人气加成总开关 | 增加「启动人气值加成 / 人气值加成启动中」按钮 |\r\n| 列表有「虚拟粉丝数」列；新增/编辑有「虚拟粉丝数」字段 | **列表去列 + 新增/编辑去字段** |\r\n| 人气值需按规则自动微增（开启后） | 每天 01:00（北京时间）按规则加成 |\r\n\r\n### 目标\r\n\r\n1. 运营可一键 **开启 / 关闭** 人气值加成  \r\n2. **列表与新增/编辑** 均不再出现虚拟粉丝数  \r\n3. 开启后按统一规则自动更新人气值；手动修改规则清晰、可验收  \r\n\r\n## 需求说明\r\n\r\n### 1. 后台界面改动\r\n\r\n:::ok\r\n### 改动 A · 人气加成按钮（同一个按钮）\r\n位置：主播管理查询区，**「新增」按钮旁边**。  \r\n\r\n| 状态 | 按钮文案 | 说明 |\r\n| --- | --- | --- |\r\n| 未开启 | **启动人气值加成** | 点击后开启加成 |\r\n| 已开启 | **人气值加成启动中** | 表示加成已开；**再点可关闭**，文案回到「启动人气值加成」 |\r\n\r\n**【重要】** 两种文案是 **同一个按钮** 的两种状态（可开可关），不是两个按钮。关闭后不再跑每日加成。\r\n:::\r\n\r\n:::ok\r\n### 改动 B · 去掉「虚拟粉丝数」（列表 + 新增/编辑）\r\n**【重要】** 现网「虚拟粉丝数」出现在两处，**两处都去掉**：\r\n\r\n| 位置 | 现网 | 改后 |\r\n| --- | --- | --- |\r\n| **主播管理列表** | 有「虚拟粉丝数」列 | **整列不展示** |\r\n| **新增主播 / 编辑主播** 弹窗 | 有「虚拟粉丝数」输入框（在登录密码与直播版面之间） | **表单不再显示该字段，不可填写** |\r\n\r\n其余字段（含 **人气值**、实际粉丝数、粉丝数、头像等）保持现网逻辑，除非另有说明。  \r\n**人气值** 仍可在新增/编辑中手改，用于加成与展示。\r\n:::\r\n\r\n:::info\r\n### 新增 / 编辑弹窗说明（原型展示，不拼图）\r\n新增与编辑为同一套表单。现网在 **登录密码** 与 **直播版面** 之间有「虚拟粉丝数」；与列表同理用红框标出，正式上线不渲染。  \r\n一屏对照见上方三图 `:::compare`（现状 + 列表去列 + 新增/编辑去字段，缩略可点放大）；交互见 `原型.html`。\r\n:::\r\n\r\n### 2. 人气值加成规则（开启后）\r\n\r\n:::ok\r\n### 核心规则（简单版）\r\n1. **只有「人气值加成」处于启动中时**，才跑每天的加成脚本。  \r\n2. 每天 **北京时间凌晨 1 点** 跑一次。  \r\n3. 对 **列表全部主播** 生效（不是可选/勾选部分主播）。  \r\n4. 脚本读到每个主播 **当时的人气值**，在此基础上随机增加 **1%～2%**。  \r\n5. 算出的数如果有小数，**向上取整**（只要有小数就进一到整数）。  \r\n6. **手动改人气** 永远以「你最后改完的那个数」为展示基础，不跟历史加成纠缠。\r\n:::\r\n\r\n#### 2.1 计算公式\r\n\r\n```text\r\n新的人气值 = 向上取整（ 脚本运行时读到的人气值 × (1 + 随机比例) ）\r\n\r\n随机比例：1%～2% 之间（含边界以研发实现约定，建议含 1% 与 2%）\r\n向上取整：例如 202.1、202.6 都变成 203\r\n```\r\n\r\n#### 2.2 和「手动改人气」的关系（【重要】）\r\n\r\n| 场景 | 怎么算 / 怎么显示 |\r\n| --- | --- |\r\n| **脚本跑之前** 改了人气 | 脚本按 **改完后的数** 做 1%～2% 加成 |\r\n| **脚本跑完之后** 又改了人气 | **直接显示你改后的数**，不再把「刚才加成多出来的」再叠上去 |\r\n\r\n**例子 1（跑之前改）**  \r\n- 原来人气 100，先改成 **200**  \r\n- 凌晨脚本读到 200，随机涨 **1.3%** → 200 × 1.013 = **202.6** → 向上取整 → **203**\r\n\r\n**例子 2（跑之后改）**  \r\n- 人气 100，脚本涨 **1.1%** → 101.1 → 向上取整 → **102**  \r\n- 脚本成功后，运营改成 **200** → 页面显示 **200**  \r\n- 再改成 **100** → 页面显示 **100**  \r\n- （不会在 102 上再自动加一层）\r\n\r\n:::key\r\n【注意】加成只看 **脚本跑那一刻读到的人气值**。跑完以后你手改成多少，就展示多少。\r\n:::\r\n\r\n### 3. 范围\r\n\r\n| 项 | 说明 |\r\n| --- | --- |\r\n| 在范围 | 中国站 · **主播管理**：可开可关按钮；**去掉虚拟粉丝数（列表列 + 新增/编辑字段）**；定时加成与手改；H5/PC 人气展示跟随后台 |\r\n| 不在范围 | **APP 单独改版**（APP 调 H5，不单做调整）；其他未说明的粉丝字段；非中国站（默认不动） |\r\n\r\n## 影响范围\r\n\r\n| 端 / 角色 | 影响 |\r\n| --- | --- |\r\n| **BE · 主播管理** | 按钮（可开可关）+ **列表去列** + **新增/编辑去字段** + 人气按脚本变化 **【本期修改】** |\r\n| 定时任务 / 后端 | 北京时间 01:00 加成脚本；关闭后不加成 **【本期修改】** |\r\n| **H5** | **热门主播** + **主播排行** 两处火焰旁人气数字跟随后台人气值 |\r\n| **PC** | 直播页 **列表卡 + 播放器上方** 两处火焰旁数字跟随后台人气值 |\r\n| 用户端 APP | **调用 H5，不做单独调整** |\r\n\r\n## 验收标准\r\n\r\n:::critical\r\n【必验】以下未勾选不得视为完成。\r\n:::\r\n\r\n- [ ] 【必验】「新增」旁有按钮，未开启显示 **启动人气值加成**，开启后显示 **人气值加成启动中**  \r\n- [ ] 【必验】启动中再点可 **关闭**，文案回到「启动人气值加成」，关闭后不再加成  \r\n- [ ] 【必验】列表 **无「虚拟粉丝数」列**  \r\n- [ ] 【必验】**新增主播** 弹窗 **无「虚拟粉丝数」字段**  \r\n- [ ] 【必验】**编辑主播** 弹窗 **无「虚拟粉丝数」字段**  \r\n- [ ] 【必验】新增/编辑仍可维护 **人气值** \r\n- [ ] 【必验】开启后，到点脚本按「当前人气 × (1+1%～2%)」并 **向上取整**  \r\n- [ ] 【必验】加成作用于 **全部主播**（非勾选部分） \r\n- [ ] 【必验】跑脚本前手改人气 → 按新数加成（例：200 → 约 1.3% → 203）  \r\n- [ ] 【必验】跑脚本后手改人气 → 直接显示手改值（例：加成到 102 后再改 200 → 显示 200）  \r\n- [ ] 【必验】未开启 / 已关闭时，到点不跑加成  \r\n- [ ] 【必验】时区为 **北京时间 01:00**  \r\n- [ ] 【必验】APP 无单独改造项（走 H5）  \r\n- [ ] 【必验】H5 **热门主播** 卡片：昵称下 **火焰 + 数字** 与后台人气值一致（加成后会变）  \r\n- [ ] 【必验】H5 **主播排行**：Top3 昵称下、列表昵称旁 **火焰 +「人气」+ 数值** 与后台人气值一致（加成后会变）  \r\n- [ ] 【必验】PC 直播页两处（列表卡 + 播放器上方）：**火焰 + 数字** 与后台人气值一致（加成后会变）\r\n\r\n## 测试范围\r\n\r\n### 测试范围说明\r\n\r\n| 类型 | 是否纳入 | 说明 |\r\n| --- | --- | --- |\r\n| 功能 · 按钮 / 列表 | 【必测】**是** | 开/关文案、去列 |\r\n| 功能 · 加成脚本 | 【必测】**是** | 可调时间或模拟触发 |\r\n| 功能 · 手改穿插 | 【必测】**是** | 跑前改 / 跑后改 |\r\n| H5 · 人气展示 | 【必测】**是** | 热门主播 + 主播排行，火焰旁数字 = 后台人气值 |\r\n| PC · 人气展示 | 【必测】**是** | 列表卡 + 播放器上方两处 = 后台人气值 |\r\n| APP | 【不必测单独改版】**否** | 调 H5，无单独调整 |\r\n| 多站 | 默认仅中国站 | |\r\n\r\n### 功能测试用例\r\n\r\n| 编号 | 场景 | 步骤 | 预期 |\r\n| --- | --- | --- | --- |\r\n| 【必测】TC-01 | 按钮文案 | 未开启看按钮 | 文案为「启动人气值加成」 |\r\n| 【必测】TC-02 | 启动 | 点击启动 | 文案变为「人气值加成启动中」 |\r\n| 【必测】TC-02b | 关闭 | 启动中再点 | 文案回到「启动人气值加成」，加成关闭 |\r\n| 【必测】TC-03 | 去列 | 看主播列表表头 | 无「虚拟粉丝数」 |\r\n| 【必测】TC-03b | 新增去字段 | 点新增，看表单 | 无「虚拟粉丝数」输入项；有「人气值」 |\r\n| 【必测】TC-03c | 编辑去字段 | 点编辑，看表单 | 无「虚拟粉丝数」输入项；有「人气值」 |\r\n| 【必测】TC-04 | 正常加成 | 开启；人气=100；模拟到点；随机落到可验区间 | 结果 = 向上取整(100×(1+r))，r∈[1%,2%] |\r\n| 【必测】TC-04b | 全部主播 | 开启后列表有多名主播，模拟到点 | **每一名**主播人气均按规则加成（非仅勾选） |\r\n| 【必测】TC-05 | 跑前手改 | 100 改 200 后再跑；设随机 1.3% | 结果为 **203** |\r\n| 【必测】TC-06 | 跑后手改 | 加成到 102 后改成 200 | 显示 **200**；再改 100 显示 **100** |\r\n| 【必测】TC-07 | 小数进位 | 构造结果带小数 | 向上取整为整数 |\r\n| 【必测】TC-08 | 关闭后到点 | 先开启再关闭，模拟到点 | 人气不因加成脚本变化 |\r\n| TC-09 | 时区 | 核对任务触发时间 | 北京时间 01:00 |\r\n| TC-10 | APP | 确认无单独需求项 | 走 H5，无 APP 单独改造 |\r\n| 【必测】TC-11 | H5 热门主播 | 打开直播 → 热门主播卡片 | 昵称下火焰旁数字 = 后台该主播人气值；加成后同步变化 |\r\n| 【必测】TC-11b | H5 主播排行 | 打开主播 → 主播排行 | Top3 昵称下、列表昵称旁火焰+「人气」+数值 = 后台人气值；加成后同步变化 |\r\n| 【必测】TC-12 | PC 位置 | 打开 PC 直播页 | 列表卡 + 播放器上方两处火焰旁数字与后台一致；加成后同步变化 |\r\n\r\n### 非本期测试范围\r\n\r\n- 虚拟粉丝数相关的其他报表（若有，确认是否连带）  \r\n- APP 单独改版（明确不做）\r\n\r\n## QA 关注点\r\n\r\n:::ok\r\n下列结论已写入正文，按此验收。\r\n:::\r\n\r\n| 编号 | 关注点 | 结论（已闭环） | 状态 |\r\n| --- | --- | --- | --- |\r\n| Q-01 | 按钮几种？ | **一个按钮**，两种文案：启动人气值加成 / 人气值加成启动中 | 已闭环 |\r\n| Q-02 | 虚拟粉丝数怎么处理？ | **列表去列** + **新增/编辑去字段**（两处都不要） | 已闭环 |\r\n| Q-03 | 几点跑脚本？ | 每天 **北京时间 01:00** | 已闭环 |\r\n| Q-04 | 涨多少？ | 当时人气的 **1%～2% 随机**，小数 **向上取整** | 已闭环 |\r\n| Q-05 | 跑前改人气？ | 按 **改后的数** 做加成 | 已闭环 |\r\n| Q-06 | 跑后改人气？ | **直接显示手改值**，不再叠加上次加成 | 已闭环 |\r\n| Q-07 | 再点按钮能否关闭？ | **可以关闭**；文案回到「启动人气值加成」 | 已闭环 |\r\n| Q-08 | H5/PC 是否改 UI？ | H5/PC **展示位置已补**（火焰旁=人气值，一般只跟数）；APP 调 H5 **不单改** | 已闭环 |\r\n| Q-09 | 发布时间？ | **0904**（2026-09-04） | 已闭环 |\r\n| Q-10 | H5 人气显示在哪？ | **两处**：① 直播→热门主播卡片；② 主播→主播排行（Top3 + 列表），均为火焰旁人气数 | 已闭环 |\r\n| Q-11 | PC 人气显示在哪？ | **直播页两处**：主播列表缩略卡 + 播放器上方，均为 **火焰 + 数字** | 已闭环 |\r\n| Q-12 | 加成全部还是可选？ | **列表全部主播**（不是可选/勾选） | 已闭环 |\r\n\r\n## 风险评估\r\n\r\n| 风险 | 等级 | 影响 | 应对 |\r\n| --- | --- | --- | --- |\r\n| 手改与脚本并发 | **中** | 数值不符合预期 | 写清「以脚本读取瞬间 / 手改最终值」；TC-05/06 |\r\n| 随机比例难复现 | **中** | 用例不好验 | 测试环境可打日志或可注入随机值 |\r\n| 误伤非中国站 | **中** | 他站人气被改 | 确认仅中国站任务 |\r\n| 全部主播量较大 | **低** | 脚本耗时 | 后端批量/分页处理；监控任务时长 |\r\n\r\n### 回滚建议\r\n\r\n- 发版回退；或后台点按钮 **关闭加成**  \r\n\r\n## 待确认\r\n\r\n无（本期待确认项已闭环）。\r\n\r\n## 修订记录\r\n\r\n| 日期 | 版本 | 说明 |\r\n| --- | --- | --- |\r\n| 2026-08-28 | v0.15 | H5 对照图改为居中紧凑并排（全局样式：手机 compare 居中） |\r\n| 2026-08-28 | v0.14 | H5 热门主播 + 主播排行图改为 **左右并排**（:::compare），避免上下叠留白 |\r\n| 2026-08-28 | v0.13 | 补 H5 **主播排行** 人气值展示位置图；更新 H5 相关说明 / 验收 / 用例 |\r\n| 2026-08-27 | v0.12 | 状态改为 **调整完成** |\r\n| 2026-08-27 | v0.11 | 闭环：加成范围 = 列表全部主播 |\r\n| 2026-08-27 | v0.10 | 现状并入一屏三图对照（现状 + 列表去列 + 新增/编辑去字段） |\r\n| 2026-08-27 | v0.9 | 列表+新增/编辑「去虚拟粉丝数」改为一屏对照（缩略可点放大） |\r\n| 2026-08-27 | v0.8 | 新增/编辑原型用红框标出「虚拟粉丝数」去掉位置（对齐列表标注风格） |\r\n| 2026-08-27 | v0.7 | 明确：新增/编辑也去掉虚拟粉丝数字段；原型弹窗可交互展示（不拼图） |\r\n| 2026-08-27 | v0.6 | 补 PC 人气值展示位置图（列表卡 + 播放器上方两处） |\r\n| 2026-08-27 | v0.5 | 补 H5 人气值展示位置图（热门主播 · 火焰旁数字） |\r\n| 2026-08-27 | v0.4 | 闭环：按钮可关闭；H5/PC 后补图；APP 调 H5 不单改；发布时间 0904 |\r\n| 2026-08-27 | v0.3 | 更新现网截图；原图+标注拼接对照；原型对齐现网（状态/操作/查询，去虚拟粉丝数列） |\r\n| 2026-08-27 | v0.2 | 写入主播管理：加成按钮（双文案）、去掉虚拟粉丝数列、01:00 加成与手改规则；补现状图与原型 |\r\n| 2026-08-27 | v0.1 | 0904/Viktor 新建骨架 |"};

  <script>
    (function () {
      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
      }
      function inlineFormat(text) {
        const priMap = { 必测: 'must-test', 必验: 'must-accept', 注意: 'note', 重要: 'important' }
        return escapeHtml(text)
          .replace(/【(必测|必验|注意|重要)】/g, (_, label) =>
            '<span class="pri pri-' + priMap[label] + '">' + label + '</span>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/==(.+?)==/g, '<mark class="hl">$1</mark>')
          .replace(/`(.+?)`/g, '<code>$1</code>')
      }
      function isPhoneShot(alt, srcPath) {
        const s = String(alt || '') + ' ' + String(srcPath || '')
        return /H5|手机|iPhone|iphone|phone|移动端|APP端|竖屏/i.test(s)
      }
      function renderMarkdownImage(alt, srcPath, assetBase) {
        const base = assetBase ? assetBase.replace(/\\/g, '/').replace(/\/?$/, '/') : ''
        if (!/^(https?:|data:)/i.test(srcPath) && !srcPath.startsWith('./') && !srcPath.startsWith('/')) {
          srcPath = base + srcPath
        } else if (srcPath.startsWith('./')) {
          const rest = srcPath.slice(2)
          const baseNoDot = base.replace(/^\.\//, '')
          srcPath = (baseNoDot && rest.startsWith(baseNoDot)) ? './' + rest : base + rest
        }
        if (/\.html?$/i.test(srcPath) || /^data:text\/html/i.test(srcPath)) {
          return (
            '<figure class="doc-proto"><iframe src="' + escapeHtml(srcPath) +
            '" title="' + escapeHtml(alt || '交互原型') +
            '" loading="lazy" scrolling="no" data-proto-frame="1"></iframe><figcaption class="cap">' +
            escapeHtml(alt || '交互原型') + '（本页内可直接操作）</figcaption></figure>'
          )
        }
        const phoneClass = isPhoneShot(alt, srcPath) ? ' is-phone' : ''
        return (
          '<figure class="doc-figure' + phoneClass + '"><img src="' + escapeHtml(srcPath) +
          '" alt="' + escapeHtml(alt) +
          '" loading="lazy" data-lightbox="1" title="点击放大查看" /><figcaption class="cap">' +
          escapeHtml(alt || '示意图') + '（点击可放大）</figcaption></figure>'
        )
      }
      function renderCompareBlock(body, assetBase) {
        const imgs = []
        const re = /!\[([^\]]*)\]\(([^)]+)\)/g
        let m
        while ((m = re.exec(body))) imgs.push(renderMarkdownImage(m[1], m[2].trim(), assetBase))
        if (!imgs.length) return renderMarkdown(body.trim(), assetBase)
        return imgs.join('')
      }
      function renderTabsBlock(body, assetBase) {
        const parts = String(body || '').trim().split(/^#{3,4}\s+/m).filter(Boolean)
        if (!parts.length) return ''
        const panes = parts.map((part) => {
          const nl = part.indexOf('\n')
          const title = (nl === -1 ? part : part.slice(0, nl)).trim()
          const rest = nl === -1 ? '' : part.slice(nl + 1)
          const imgs = renderCompareBlock(rest, assetBase)
          return { title, html: imgs ? '<div class="doc-compare">' + imgs + '</div>' : '' }
        })
        let bar = '<div class="doc-tab-bar" role="tablist">'
        let panesHtml = ''
        panes.forEach((p, i) => {
          const on = i === 0 ? ' is-on' : ''
          bar += '<button type="button" class="doc-tab-btn' + on + '" data-tab="' + i + '">' +
            escapeHtml(p.title) + '</button>'
          panesHtml += '<div class="doc-tab-pane' + on + '" data-pane="' + i + '">' + p.html + '</div>'
        })
        bar += '</div>'
        return '<div class="doc-tabs">' + bar + panesHtml + '</div>'
      }
      function renderMarkdown(src, assetBase) {
        let text = String(src || '').replace(/\r\n/g, '\n')
        const calloutStore = []
        const base = assetBase ? assetBase.replace(/\\/g, '/').replace(/\/?$/, '/') : ''
        text = text.replace(/:::(\w+)\s*\n([\s\S]*?)\n:::/g, (_, type, body) => {
          const idx = calloutStore.length
          if (type === 'compare') {
            calloutStore.push({ type: 'compare', html: renderCompareBlock(body, assetBase) })
          } else if (type === 'tabs') {
            calloutStore.push({ type: 'tabs', html: renderTabsBlock(body, assetBase) })
          } else {
            calloutStore.push({ type, html: renderMarkdown(body.trim(), assetBase) })
          }
          return '\n\n%%CALLOUT_' + idx + '%%\n\n'
        })
        const blocks = text.split(/\n{2,}/)
        const html = []
        for (let block of blocks) {
          block = block.trim()
          if (!block) continue
          const calloutRef = block.match(/^%%CALLOUT_(\d+)%%$/)
          if (calloutRef) {
            const item = calloutStore[Number(calloutRef[1])]
            if (item.type === 'compare') html.push('<div class="doc-compare">' + item.html + '</div>')
            else if (item.type === 'tabs') html.push(item.html)
            else html.push('<div class="callout callout-' + item.type + '">' + item.html + '</div>')
            continue
          }
          if (/^```/.test(block)) {
            const lines = block.split('\n')
            const code = lines.slice(1, lines[lines.length - 1] === '```' ? -1 : undefined).join('\n')
            html.push('<pre><code>' + escapeHtml(code) + '</code></pre>')
            continue
          }
          if (block.startsWith('# ')) { html.push('<h1>' + inlineFormat(block.slice(2)) + '</h1>'); continue }
          if (block.startsWith('## ')) { html.push('<h2>' + inlineFormat(block.slice(3)) + '</h2>'); continue }
          if (block.startsWith('### ')) { html.push('<h3>' + inlineFormat(block.slice(4)) + '</h3>'); continue }
          if (/^\|/.test(block) && block.includes('\n|')) {
            const rows = block.split('\n').filter((l) => /^\|/.test(l) && !/^\|\s*-+/.test(l))
            if (rows.length) {
              const parseRow = (row) =>
                row.replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim())
              const head = parseRow(rows[0])
              const isKv = head.length === 2 && head[0] === '项' && /^(内容|说明)$/.test(head[1])
              const nowrapCol = head.map((c) => /^(编号|#|日期|版本)$/.test(c))
              let table = '<table' + (isKv ? ' class="kv-table"' : '') + '><thead><tr>'
              head.forEach((c, i) => {
                table += '<th' + (nowrapCol[i] ? ' class="cell-nowrap"' : '') + '>' + inlineFormat(c) + '</th>'
              })
              table += '</tr></thead><tbody>'
              rows.slice(1).forEach((row) => {
                table += '<tr>'
                parseRow(row).forEach((c, i) => {
                  table += '<td' + (nowrapCol[i] ? ' class="cell-nowrap"' : '') + '>' + inlineFormat(c) + '</td>'
                })
                table += '</tr>'
              })
              table += '</tbody></table>'
              html.push(table)
              continue
            }
          }
          if (/^(- |\d+\. )/.test(block)) {
            const lines = block.split('\n')
            const ordered = /^\d+\. /.test(lines[0])
            const tag = ordered ? 'ol' : 'ul'
            const items = lines
              .map((line) => line.replace(/^(- |\d+\. )/, ''))
              .map((line) => '<li>' + inlineFormat(line) + '</li>')
              .join('')
            html.push('<' + tag + '>' + items + '</' + tag + '>')
            continue
          }
          if (block === '---') { html.push('<hr />'); continue }
          const linkMatch = block.match(/^\[([^\]]+)\]\(([^)]+)\)$/)
          if (linkMatch) {
            let href = linkMatch[2].trim()
            if (!/^(https?:|data:)/i.test(href) && !href.startsWith('./') && !href.startsWith('/')) href = base + href
            else if (href.startsWith('./')) {
              const rest = href.slice(2)
              const baseNoDot = base.replace(/^\.\//, '')
              href = (baseNoDot && rest.startsWith(baseNoDot)) ? './' + rest : base + rest
            }
            html.push(
              '<p><a href="' + escapeHtml(href) + '" target="_blank" rel="noopener">' +
              escapeHtml(linkMatch[1]) + '</a></p>'
            )
            continue
          }
          const imgLines = block.split('\n').map((l) => l.trim()).filter(Boolean)
          if (imgLines.length && imgLines.every((line) => /^!\[([^\]]*)\]\(([^)]+)\)$/.test(line))) {
            html.push(imgLines.map((line) => {
              const m = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/)
              return renderMarkdownImage(m[1], m[2].trim(), assetBase)
            }).join('\n'))
            continue
          }
          if (/<span class="tag/.test(block)) {
            const tags = block.replace(
              /<span class="tag([^"]*)">([\s\S]*?)<\/span>/g,
              (_, cls, label) => '<span class="tag' + cls + '">' + escapeHtml(label.trim()) + '</span>'
            )
            html.push('<div class="tag-row">' + tags.replace(/\n/g, ' ') + '</div>')
            continue
          }
          html.push(
            '<p>' + block.split('\n').map((line) => inlineFormat(line)).join('<br>') + '</p>'
          )
        }
        return html.join('\n')
      }
      function ensureLightbox() {
        let lb = document.getElementById('img-lightbox')
        if (lb) return lb
        lb = document.createElement('div')
        lb.id = 'img-lightbox'
        lb.className = 'img-lightbox'
        lb.innerHTML =
          '<img alt="" /><div class="lb-hint">滚轮持续放大/缩小 · 拖拽移动 · 点空白或 Esc 关闭</div>'
        document.body.appendChild(lb)
        const lbImg = lb.querySelector('img')
        let scale = 1
        let tx = 0
        let ty = 0
        let dragging = false
        let lastX = 0
        let lastY = 0

        function applyTransform() {
          lbImg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'
        }
        function resetView() {
          scale = 1
          tx = 0
          ty = 0
          dragging = false
          lb.classList.remove('is-dragging')
          applyTransform()
        }
        const close = () => {
          lb.classList.remove('is-open')
          resetView()
        }
        lb.addEventListener('click', (e) => {
          if (e.target === lb || e.target.classList.contains('lb-hint')) close()
        })
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && lb.classList.contains('is-open')) close()
        })
        lb.addEventListener(
          'wheel',
          (e) => {
            if (!lb.classList.contains('is-open')) return
            e.preventDefault()
            const rect = lbImg.getBoundingClientRect()
            const ox = (e.clientX - (rect.left + rect.width / 2)) / scale
            const oy = (e.clientY - (rect.top + rect.height / 2)) / scale
            const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12
            const next = Math.min(8, Math.max(0.5, scale * factor))
            if (next === scale) return
            tx += ox * (scale - next)
            ty += oy * (scale - next)
            scale = next
            applyTransform()
          },
          { passive: false },
        )
        lbImg.addEventListener('pointerdown', (e) => {
          if (!lb.classList.contains('is-open') || e.button !== 0) return
          dragging = true
          lastX = e.clientX
          lastY = e.clientY
          lb.classList.add('is-dragging')
          try { lbImg.setPointerCapture(e.pointerId) } catch (_) {}
          e.preventDefault()
        })
        lbImg.addEventListener('pointermove', (e) => {
          if (!dragging) return
          tx += e.clientX - lastX
          ty += e.clientY - lastY
          lastX = e.clientX
          lastY = e.clientY
          applyTransform()
        })
        const endDrag = (e) => {
          if (!dragging) return
          dragging = false
          lb.classList.remove('is-dragging')
          try { lbImg.releasePointerCapture(e.pointerId) } catch (_) {}
        }
        lbImg.addEventListener('pointerup', endDrag)
        lbImg.addEventListener('pointercancel', endDrag)
        lbImg.addEventListener('click', (e) => e.stopPropagation())
        lb._resetView = resetView
        return lb
      }
      function markPhoneFigures(root) {
        root.querySelectorAll('.doc-figure:not(.is-phone) img[data-lightbox]').forEach((img) => {
          const apply = () => {
            if (!img.naturalWidth) return
            // 竖屏（高明显大于宽）按手机尺寸收窄
            if (img.naturalHeight > img.naturalWidth * 1.15) {
              const fig = img.closest('.doc-figure')
              if (fig && !fig.closest('.doc-compare')) fig.classList.add('is-phone')
            }
          }
          if (img.complete) apply()
          else img.addEventListener('load', apply)
        })
      }
      function bindProtoFrameResize(root) {
        window.addEventListener('message', (e) => {
          const data = e && e.data
          if (!data || data.type !== 'proto-resize') return
          const h = Number(data.height)
          if (!h || h < 100) return
          root.querySelectorAll('iframe[data-proto-frame]').forEach((frame) => {
            try {
              if (frame.contentWindow === e.source) {
                frame.style.height = Math.ceil(h) + 'px'
              }
            } catch (_) { /* ignore */ }
          })
        })
      }
      function bindDocImageLightbox(root) {
        const lb = ensureLightbox()
        const lbImg = lb.querySelector('img')
        root.querySelectorAll('img[data-lightbox]').forEach((img) => {
          img.addEventListener('click', () => {
            if (typeof lb._resetView === 'function') lb._resetView()
            lbImg.src = img.currentSrc || img.src
            lbImg.alt = img.alt || ''
            lb.classList.add('is-open')
          })
        })
        markPhoneFigures(root)
        bindProtoFrameResize(root)
        bindDocTabs(root)
      }
      function bindDocTabs(root) {
        root.querySelectorAll('.doc-tabs').forEach((wrap) => {
          wrap.querySelectorAll('.doc-tab-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
              const i = btn.getAttribute('data-tab')
              wrap.querySelectorAll('.doc-tab-btn').forEach((b) => b.classList.toggle('is-on', b === btn))
              wrap.querySelectorAll('.doc-tab-pane').forEach((p) => p.classList.toggle('is-on', p.getAttribute('data-pane') === i))
            })
          })
        })
      }
      function mountDocToc(root) {
        const box = document.getElementById('docToc')
        const panel = document.getElementById('docTocPanel')
        if (!box || !panel) return
        const used = Object.create(null)
        const items = []
        root.querySelectorAll('h2, h3').forEach((el) => {
          const text = String(el.textContent || '').replace(/\s+/g, ' ').trim()
          if (!text) return
          let base = 'sec-' + text.replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fff\-]/g, '')
          if (base === 'sec-') base = 'sec'
          let id = base
          let n = 2
          while (used[id]) { id = base + '-' + n; n++ }
          used[id] = true
          el.id = id
          items.push({ id: id, text: text, level: el.tagName === 'H3' ? 3 : 2 })
        })
        if (!items.length) {
          box.hidden = true
          panel.innerHTML = ''
          return
        }
        box.hidden = false
        panel.innerHTML = items.map(function (it) {
          return '<a class="toc-l' + it.level + '" href="#' + it.id + '" title="' + escapeHtml(it.text) + '">' + escapeHtml(it.text) + '</a>'
        }).join('')
        const links = panel.querySelectorAll('a')
        links.forEach(function (a) {
          a.addEventListener('click', function (e) {
            e.preventDefault()
            const target = document.getElementById(a.getAttribute('href').slice(1))
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' })
          })
        })
        function syncActive() {
          let current = items[0] && items[0].id
          items.forEach(function (it) {
            const el = document.getElementById(it.id)
            if (el && el.getBoundingClientRect().top <= 72) current = it.id
          })
          links.forEach(function (a) {
            a.classList.toggle('is-active', a.getAttribute('href') === '#' + current)
          })
        }
        window.addEventListener('scroll', syncActive, { passive: true })
        syncActive()
      }

      // 文档刷新：停留在刚才阅读位置（不置顶）。原型.html 单独打开时自行置顶，与文档分开。
      const DOC_SCROLL_KEY = 'doc-local-scroll:' + location.pathname
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      let savedScroll = 0
      try { savedScroll = Number(sessionStorage.getItem(DOC_SCROLL_KEY) || 0) || 0 } catch (_) {}
      function saveDocScroll() {
        try { sessionStorage.setItem(DOC_SCROLL_KEY, String(window.scrollY || 0)) } catch (_) {}
      }
      function restoreDocScroll() {
        const y = Math.max(0, savedScroll)
        const apply = () => window.scrollTo(0, y)
        apply()
        requestAnimationFrame(apply)
        setTimeout(apply, 80)
        setTimeout(apply, 320)
      }
      let scrollTimer = null
      window.addEventListener('scroll', () => {
        if (scrollTimer) clearTimeout(scrollTimer)
        scrollTimer = setTimeout(saveDocScroll, 120)
      }, { passive: true })
      window.addEventListener('beforeunload', saveDocScroll)

      const page = window.DOC_PAGE || {}
      const bodyEl = document.getElementById('body')
      bodyEl.innerHTML = renderMarkdown(page.text || '', './')
      bindDocImageLightbox(bodyEl)
      mountDocToc(bodyEl)
      restoreDocScroll()
    })()
  </script>
</body>
</html>
