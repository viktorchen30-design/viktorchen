  <script>
    window.DOC_PAGE = {"title":"【BE】用户登录异常二次验证逻辑优化","text":"# 【BE】用户登录异常二次验证逻辑优化\n\n\u003cspan class=\"tag tag-be\"\u003eBE\u003c/span\u003e\n\u003cspan class=\"tag tag-pri\"\u003e待评审\u003c/span\u003e\n\u003cspan class=\"tag tag-mod\"\u003e登录 · 二次验证\u003c/span\u003e\n\u003cspan class=\"tag tag-site\"\u003e三站同一套\u003c/span\u003e\n\n:::lead\n**本期主改：账号密码登录时，要不要发「异常设备二次验证」短信。**  \n现网主要看「是不是新设备」，出口一跳就反复要码。本期不拿次数卡人，只改「像本人时少发」：像本人就少发，不像仍发一次；**填对就能进**。  \n**手机号登录**怎么发码不改（仍必发）。**一个账号只能绑一个手机号**；没绑就登不进去。绑过且登录成功后，这个号绑上的那个账号再走**账号密码**：App、电脑客户端（不是网页）交上来的 **设备号** 还在授信库 → 可以不发；网页不留痕迹，再账密 **走打分，不能因为这张网免验**（手机号登录刚记下的 IP 几乎一定对得上），**发一次，填对记住**。绑卡／改密／代理手机登录怎么发码不改。  \n**不拦登录**（不改登录门、不取消验证）。不要用户授权。用户端无新页。  \n条件表是为了 **后台认人、本人少收码**，登录过程 **无感知**：不要为了判二次验证让人多等。\n:::\n\n## 业务阅读指引（【重要】）\n\n业务与技术共用一份，不另做业务版。\n\n| 读者 | 怎么读 | 看到哪停 |\n| --- | --- | --- |\n| **业务** | 只看 **「业务速览」** | 速览末尾 **「业务读到此处即可停」** |\n| **研发／测试** | 从 **「研发／测试详版」** 起往下 | 无感知时长、6 问、红线、已信任、条件／打分、记住、验收与用例均须覆盖 |\n\n## 业务速览（业务需关注）\n\n### 背景\n\n| 项 | 说明 |\n| --- | --- |\n| 谁提的 | **业务**提出。产品方案制作人：**veigar**。8 月短信用量对账看到登录验证码异常偏高（越南更明显），判断大头是 **异常设备二次验证在反复发**，随后立项 |\n| 为什么要做 | 现网这条二次验证 **几乎只认设备号**。网页设备号常变、出口 IP 一跳（落网，越南手机网尤甚），**本人一天能收到 20 多次**。要减的是同人反复验，**不能**为了少发把盗号也免验 |\n| 为什么这么改 | **不取消验证**（风控缺口），**不用次数停发**（人会登不进去）。只改判定：像本人就少发（痕迹还在、客户端号还在、还是自己的网），不像本人仍发一次、填对记住。落网、号变、换域名都是 **减少次数，不能免验**。**不能**变成「为了少发码，先让所有人多等一会儿」 |\n\n填对就能进，**不是**不让登，**也不是**每次都验。\n\n:::ok\n**你可以这样理解（三句话）**\n\n1. **已经认过这台 → 不发。** 网页看这个浏览器还有没有本账号痕迹（不按天过期，退出或清掉才没）；App／电脑客户端看号还在不在库。号变了、网跳了，痕迹还在也不发——这是少发的主路径。  \n2. **没认过 → 须这账号用过的家里／自己手机流量，再加还是这台机。** 换了主域名也一样，**不能**靠换域名免验。  \n3. **不像本人 → 发一次。** 填对登录成功就记下，下次少发。落网、号变、换域名，都是 **减少次数，不是免验**。发出去没登成、填错，都不记。\n\n**不发码**\n\n| 情况 | 结果 |\n| --- | --- |\n| 同一浏览器验过，痕迹还在，没换系统（苹果还是苹果） | **不发**。网页设备号再变也不发。同一网页里从手机系统换成电脑系统，才算真换机 |\n| 自己的 App／电脑客户端，号还在库 | **不发** |\n| 网页痕迹没了，但还是家里／自己手机流量，系统＋屏幕还对 | **不发**。只走过手机号登录的第一次网页账密除外（这张网也不免验） |\n| 出口跳了，但痕迹还在，或 App／电脑客户端号还在库 | **不发** |\n| 同一部手机网页换 App、同一台电脑网页换电脑客户端：这次客户端号在库，或自己的网再加还是这台机 | **不发**。手机网页再去电脑客户端对不上 → 要验，填对后下次这台客户端不发 |\n| 手机打开电脑网址会进手机页 | 不算换电脑登录 |\n\n网页号不单独免验（号常变，网吧电脑也会进库）。退出登录清掉本账号痕迹。网吧没退出＝痕迹还在，算人还坐在这台机上。\n\n**两张网**（服务端看这次出口就能分，登录页不再采。不是「看起来像家里」就过）\n\n| 哪种网 | 怎么认 | 没痕迹、还是这台机时 |\n| --- | --- | --- |\n| **公共网** | 网吧、机场、酒店、商场 WiFi、机房／代理 | **发**。换主域名也发。即使这个地址上次来过，也不当家里 |\n| **自己的网（家里）** | 这账号 **上次成功或近 30 天常用** 出现过的那张网，**且不是公共网** | **不发**（只走过手机号登录的第一次网页账密除外） |\n| **私人网，但这账号没用过** | 不像公共网，但 IP 对不上上次／常用（弱网跳了，或别人家里） | **发一次**。换主域名也发。填对后这个浏览器有痕迹，下次少发 |\n\n**换主域名**（例：手机 `m.b123.com` → `m.b234.com`；电脑 `b123.com` → `b234.com`。三站换站未换国家也一样。APP／PC 壳不套）\n\n旧站痕迹带不过去，H5 号又常变，弱网再跳 IP，三件会叠在同一个人身上。  \n**不算真换机，也不另开免验。** **已经账密认过**（这账号曾经账号密码填对或免验成功过；**手机号登录不算**）、还是自己的网 → 不发。网跳了、没有痕迹 → **发一次，填对记住**，下次这个新域名不发。  \n只走过手机号登录、第一次网页账密又换了域名：这张网也不免验，**发一次**（新域名、无痕迹，有疑似风险）。  \n在网吧、换了国家、手机网页换成电脑网页（系统变了）→ 仍要验。  \n要防盗号：同档机、换个域名，都不能单独免验。\n\n**发一次码（填对记住，下次少发）**\n\n| 情况 | 这一次 | 下次 |\n| --- | --- | --- |\n| 换国家、真换机、新设备＋新网络（系统或屏幕对不上） | **换国家一定发一次**（痕迹挡不住，画像过期也要比上次记过的国家） | 该国／这台机已记下，不再因同一件事反复验 |\n| 后台删了这台授信、这台被挤掉后又来、改密／解绑后第一次 | 发一次 | 填对后记下。App、电脑客户端还是这个 **设备号** 不发；网页靠这次留下的痕迹 |\n| 完全没登成功过 | 发一次 | 有画像／痕迹，再登按上面「不发」走 |\n| 只走过手机号登录，第一次用网页走账号密码 | 发一次（走打分，这张网也不免验；换了主域名也发） | 填对后这个浏览器有痕迹，再登不发。App／电脑客户端还是这个设备号可以不发 |\n| 网页清站点，或换了主域名，痕迹没了、号也变了、网也跳了 | 发一次 | 填对后这个浏览器有痕迹，再登不发 |\n| 网吧／机场／酒店／商场 WiFi、机房／代理，又没有痕迹 | 发一次 | 公共出口不当家里网。自己的手机 App 号在库仍不发 |\n\n没有密码进不去。有密码也一样：同款机几项会一起中，网吧 IP 也会和别人撞上，**单独哪一件都不够**。过线要痕迹，或客户端号在库，或 **自己的网** 再加还是这台机。换域名、落网、号变：能少发，**不能免验**。\n:::\n\n### 改造前 → 改造后\n\n| 原来 | 现在 |\n| --- | --- |\n| 设备号对不上 → 当新设备，发码 | 网页认痕迹，App／电脑客户端认库。没认过须 **自己的网**＋还是这台机。同款机不够。公共网不算自己的网 |\n| 出口 IP 一跳 → 又当新网 | 痕迹还在或客户端号还在库 → 不发。还是这账号用过的家里／自己手机流量，**再加还是这台机** → 不发（只走过手机号登录的第一次网页账密除外）。清站点又跳网 → **发一次，填对记住** |\n| 网页设备号常变 → 同人反复当新设备 | 痕迹还在就不发。网页号不单独免验。换了主域名：已经账密认过、有自己的网才不发；没有，或只走过手机号登录的第一次网页账密 → 发一次，填对后新域名少发 |\n| 为少发码在登录页采一长串 | **不采用**。条件多＝马上能交的一起中。显卡等太久可以缺，系统／屏幕／像素比不能缺 |\n\n:::ok\n不改登录门：不要的仍不要（次数停发、取消验证、拦登录）。要的仍要（红线、真换机、填错按现网）。用户端无新页。  \n\n**登录无感知（两条都要）**  \n像本人：不弹二次验证页，直接进去。  \n过程：打开登录页、点登录到进去／出验证页，人感觉不到比改造前慢。  \n难度靠点登录就能交的（痕迹、客户端号、系统、屏幕、像素比）和服务端已经能看到的 IP／国家。打开页不采齐。城市、时区、语言、品牌、核数、内存、页类型打分本期不采。\n:::\n\n### 账号密码点登录之后（6 问）\n\n![账号密码点登录之后，要不要发二次验证短信](./flowchart.svg)\n\n三个「发一次短信」结果相同：不是拒绝登录。**填对 → 记住 → 登录，下次少发。** 填错按现网原逻辑，不记住。发出没登成，不记、不消耗。\n\n:::ok\n**业务读到此处即可停。**  \n要对细则 → 找产品／研发看后面「详版」（和本节同一口径，只是更细）。\n:::\n\n---\n\n## 研发／测试详版（业务可跳过）\n\n:::info\n以下为 **全量底稿**。**业务默认跳过**。  \n口径以 **业务速览** 为准；详版是展开与落地，**不另立第二套规则**。拍板结论见文末「已闭环」，此处不另开「已确认」。\n:::\n\n下面按判定走法写。先看 **「登录无感知（时长）」**：条件表是为了本人少打扰，不能反过来把登录拖慢。\n\n**现网**＝改造前已上线的二次验证与授信。未写入本期变更的，改后与改造前一致。\n\n## 基本信息\n\n| 项 | 内容 |\n| --- | --- |\n| 需求名称 | 【BE】用户登录异常二次验证逻辑优化 |\n| 端 | **BE**（判定一套）。条件对照：**H5／PC／App**（标来源） |\n| 站点 | **中国／越南／国际同一套**，不分站 |\n| 模块 | 登录 · 异常设备二次验证 |\n| 入口 | 账号密码登录触发的异常设备二次验证 |\n| 负责人 | veigar |\n| 协作 | BE、H5、PC、App、后台、测试 |\n| 状态 | 待评审 |\n| 发布时间 | 待定 |\n| 界面 | 用户端 **无新页**（免验不新提示；要验沿用现网二次验证页）。不为二次验证加「正在识别」之类等待提示 |\n| APP／PC | 无新页。按「各端能交什么」交。本期补齐：PC 显卡档；App 屏幕／像素比／设备型号。老版本交不上当缺项，不另做兼容开关。打开页不采齐；点登录交能马上交的；等太久当缺项。登录时长无感知见下节 |\n| 交付物 | [需求说明.md](./需求说明.md)（正文）；[流程图.html](./流程图.html)（6 问）；[index.html](./index.html)（本地入口，同步生成） |\n\n## 不纳入本期\n\n| # | 不做什么 | 说明 |\n| --- | --- | --- |\n| 1 | 用日／月次数上限停发、停登 | 会拦用户，与目标相反 |\n| 2 | 取消二次验证 | 风控缺口 |\n| 3 | 短信通道压降 | 不是判定逻辑 |\n| 4 | 改其它 OTP 的发送规则 | 手机号登录、代理手机登录、注册／绑卡／改密 **怎么发码** 不在本期改；这几类 **不进** 本期 6 问。手机号登录仍必发 |\n| 5 | 改授信 10 台上限、删授信后台界面 | 上限仍是 10，删授信界面保持改造前。**挤哪台**见设备号库（先间隔最远，时间相同挤最先记进库的）。被挤的号再来见 X-4 |\n| 6 | 账号密码通过之后、二次验证之前的现网其它登录校验 | **不改**。有问题走改造前的处理；没问题才进入本期短信判定 |\n| 7 | 验证码填错、过期、重发、输错次数 | **发送规则不改**（几次、间隔按现网）。不管填没填、登没登成。只有填对才记住环境并登录 |\n| 8 | 向用户要授权、或用表外信息 | **不采用**。精确定位、通讯录、广告标识等不写。表里没有的不当对照 |\n| 9 | 代理手机登录写本期画像 | 代理手机登录：**不**写本期画像、**不**留痕迹。手机号登录：输入手机号直接取码，**必发**，**不进** 6 问，**不**留二次验证痕迹。**一个账号只能绑一个手机号**。该手机号 **绑得上账号** → 登录成功按条件表能交的记本期画像，设备号进授信 10 台库（挂这个号绑上的那个账号；和账密同一套、同一挤法）。之后账密同一设备号还在库、未踩红线 → **App／PC 壳已信任，不打分**；H5 无痕迹走打分，**不能因这张网免验，发一次记住**（换主域名也发）。号已变同样发一次（不当完全没历史）。没绑账号＝手机号登录进不去，不记画像、不进库，也没有后续账密；不按「绑不上再账密」造数。发出码没填／关页：没登录成功就不写、不进库。代理手机登录不记本期画像。若现网把号写入这 10 台库，挤法仍按设备号库（先间隔最远，时间相同挤最先记进库的） |\n| 10 | 后台把「登录」拆成三项记账 | 不在本期。两处筛选项、何时记哪一项，改到【WEB／BE】用户使用短信优化方案第一期 |\n| 11 | 打开登录页为二次验证采齐条件表 | **不采用**。条件表是后台认人用的，不是进页先判 20 条。打开页、点登录时长跟改造前同一量级。等太久交不上＝缺项，不卡登录 |\n| 12 | 为二次验证把登录拖慢、或加等待提示 | **不采用**。无感知＝像本人直接进，并且过程不比改造前多等。不为凑齐显卡让人空转。**不是**少交系统／屏幕／像素比 |\n| 13 | 低档加分、时区／语言扣分 | **不纳入**。城市／页类型／时区／语言／品牌／核数／内存对满 60 没有决定作用（低档封顶 12 堆不满）。扣分还会把家里网 67 打成发码。本期不采、不加、不扣。防盗靠红线＋多件一起中，不靠采得慢 |\n\n## 登录无感知（时长）\n\n条件表、打分、已信任，都是为了 **本人账密登录时感觉不到二次验证**：像本人不弹页、直接进去。少发码是结果，**不是**先让人多等再进。\n\n**不会回到现网那种频繁发码。** 现网反复要码，是因为几乎只认设备号。本期难度靠几件便宜条件一起中，缺慢项也够用：\n\n| 少发码靠什么 | 要不要等一长串 | 人看见什么 |\n| --- | --- | --- |\n| **已信任**：这个浏览器痕迹还在；或 App 号还在库；或 PC 壳号在库／本壳有痕迹 | 不要。点登录就能带 | 未踩红线 **直接进去**，不打分 |\n| **自己的网**：这账号上次或常用出现过、且不是公共网，再加中档 | IP／出口类型服务端取，不用客户端再采 | 满 60 **直接进去**。只走过手机号登录的第一次网页账密：这张网也不免验 |\n| **换主域名** | 不另采。痕迹带不过去走同一套打分 | 已经账密认过、有自己的网 → 不发。没有，或只走过手机号登录的第一次网页账密 → **发一次，填对记住**。不能免验 |\n| **同国家＋系统＋屏幕＋像素比** | 点登录就能交 | **不能单独免验**（61 不够）。换域名也一样 |\n| **公共网**（网吧／机场／酒店／商场 WiFi、机房／代理） | 服务端已经能看到地址 | **不当自己的网**。无痕迹 → 发一次。换主域名也发 |\n\n**点登录必须交（少交才会频繁发码）**  \n设备号、痕迹（有则带）、系统、屏幕、像素比；App 再交型号。IP／国家服务端取。  \n**对满 60 没有用的，本期不采：** 城市、页类型、时区、语言、品牌、核数、内存。低档封顶 12，堆不满 60；采了登录更慢，帮不上「一起符合」的难度。\n\n**等太久才允许缺（不是少发码主路径）**  \n主要是 **显卡**。有像素比就 **不必采显卡**（第三项已经有 16 分）。像素比交不上、显卡能马上交到，才用显卡顶这 16 分。核数／内存对 60 没影响，**本期不采**。\n\n**填对记住，不会反复。** 即使慢项缺了发了一次：填对 → 号进库、留痕迹 → 下次未踩红线走已信任，**不再靠凑齐 20 条**。这和现网「每次号一变就再发」不是一回事。\n\n**两条都要，缺一条就不算过**\n\n| # | 无感知 | 人看见什么 | 不过是什么 |\n| --- | --- | --- | --- |\n| 1 | 像本人少打扰 | 已信任，或满 60 **且是自己的网**：**直接进去** | 本来有痕迹／客户端号／自己的网＋还是这台机，却多出二次验证页；或同档机／网吧免验进去；或只走过手机号登录的第一次网页账密（含换域名）因这张网免验进去 |\n| 2 | 过程不拖时长 | 打开登录页、点登录到进去或出验证页，**跟改造前同一量级**，人感觉不到多等 | 进页转一截、点登录后空等很久才出结果；或冒出「正在识别设备」 |\n\n**两条打架时：只允许显卡这种慢项缺，不允许主项缺。**  \n有像素比就不采显卡。系统／屏幕／像素比／设备号／痕迹 **必须点登录就交**。对满 60 没用的不采。\n\n**时机（结果）**\n\n| 时候 | 做什么 | 不要 |\n| --- | --- | --- |\n| 打开登录页 | 跟改造前一样进页。不为二次验证先读一长串 | 进页先采齐 20 条再让人点登录 |\n| 点登录 | **必须**带上当时能马上交的认人项（上表）。IP／国家／城市服务端取。6 问在账密对了之后 | 为显卡等齐了再提交；也 **不要** 为了快把系统／屏幕／像素比丢掉 |\n| 已信任（痕迹还在，或 App 号在库，或 PC 壳号／本壳痕迹） | 未踩红线就放，**不打分** | 等打分项齐了才放 |\n| 显卡等太久 | 当缺项，不报错，该进的进、该出验证页的出 | 转圈卡死、接口报错、加等待文案 |\n| 手机号登录 | 仍必发、不进 6 问。马上能交的字段照交，**更不能**为二次验证拖这一次 | 打开页／点取码为二次验证采一长串 |\n\n越南低端机、弱网、老版本 App／PC **同样过**。不能只在办公室快机上过。老版本交不上＝缺项，不另做兼容开关；老版本至少把能交的系统／屏幕／像素比交上。\n\n## 检验逻辑（6 问）\n\n图在速览末尾，此处不重复贴。H5／PC／App 同一套。绑卡／改密／手机号登录不进，见「不纳入本期」。\n\n| 顺序 | 问 | 分叉（离开主干，停下） | 往下继续 |\n| --- | --- | --- | --- |\n| 1 | 账号密码对不对？ | **否**：现网失败提示，结束 | 是 → 问 2 |\n| 2 | 现网其它登录校验有没有问题？ | **有问题**：现网原来怎么处理就怎么处理，本期不改 | **没问题** → 问 3 |\n| 3 | 踩红线了吗？ | **是**：**发一次短信**。填对 → 记住 → 登录；**填错按现网原逻辑** | 否 → 问 4 |\n| 4 | 已信任吗？（网页看痕迹；App 看号在库；PC 壳看号或本壳痕迹） | **是**：**不发短信**，登录 | 否 → 问 5 |\n| 5 | 这账号有没有可对比的环境画像？ | **公用、该端独特、账号可对照同名项都没有**：**发一次短信**。填对 → 记住 → 登录；**填错按现网原逻辑** | 有任一项 → 问 6 |\n| 6 | 打分过线了吗？须满 60 **且是自己的网** | **不够，或是公共网，或 IP 没命中，或只走过手机号登录的第一次网页账密**（换了主域名也一样）：**发一次短信**。填对 → 记住 → 登录；**填错按现网原逻辑** | **满 60 且自己的网**：**不发短信**，登录。换主域名不另开过线。**只走过手机号登录的第一次网页账密：这张网也不免验，换域名也发** |\n\n第 2 问「其它登录校验」＝账号密码已经对了之后、还没轮到二次验证短信之前，**改造前本来就有的那些校验**（账号状态等，以现网为准）。有问题不走进本期短信判定。\n\n三个「发一次短信」结果相同：不是拒绝登录。多条红线同时命中，也 **只发一次**。  \n**填对**：记住环境，登录。下次登录仍从第 1 问；短信判定从第 3 问再走。未踩红线且已信任，才在第 4 问停住。  \n**填错**：按现网二次验证原来怎么处理就怎么处理（提示、可重试几次、锁住等），**本期不改**。填错不记住环境。  \n**发出码但没登录成功**（没填、关页、填错）：**判定／记住／该端记录／红线消耗一律以登录成功为准**。下次再登从第 1 问重走，**不**当已验过、**不**写环境记录、**不**留痕迹。X-3／X-4／X-6／X-7 **没消耗**，下一次账号密码仍要验。\n\n:::warn\n账号密码正确 **只说明第一道过了**，不能单独拿来免短信。盗号往往也有密码。\n:::\n\n## 必须仍发码（红线 · 防盗号）\n\n命中任一条，**即使**下面某些「像」，也 **仍发码**。分数不能抵。登录步骤与改造前真新设备相同，**不是**拒绝登录。\n\n**环境记录是什么**（文中不用「流水」，以免和投注流水混）  \n这账号每一次 **登录成功** 留下的 **一条环境记录**：端（H5／PC／App）、时间、IP、国家、城市，以及这次读到的系统／屏幕／显卡／型号等。只 **追加**，不拿新的去盖掉旧的。没成功登录不写。从成功时刻起留 **720 小时**。  \n**算写入**：账密填对或免验进去；**手机号登录成功且该手机号绑得上这个账号**（**一个账号只能绑一个手机号**；画像／设备号挂这个号绑上的那个账号，之后账密对照。本期不按一号多账号造数）。  \n**不写**：手机号登录没登录成功（没绑账号进不去，或发出码没填）；代理手机登录。没绑账号也就没有后续账密，不按「绑不上再账密」造数。  \n要解决的：下次登录得有「上次这账号／这端长什么样」才能比（红线、打分、常用）。只留一行会把手机史盖成电脑，所以一条条往后记。文中「上次」「该端已有记录」「常用」都从这些环境记录取。\n\n**「该端已有记录」／文中「上次」**  \n文中所有「上次」只从 **登录成功** 的环境记录取。没成功登录，不会写入次，也就没有可对比的上次。  \n**有记录＝这账号在这端登录成功过**；这条环境记录 **一定带着端**（H5／PC／App），不会出现「有上次但没端」。  \n- **算**：二次验证填对后登录成功；打分／已信任免验成功登录；手机号登录成功且绑得上该账号。近 720 小时内这条还在，才叫该端已有记录。  \n- **不算**：发出码但没填、关页、填错；只点了登录没进去；代理手机登录。没绑账号＝手机号登录进不去，不算这个账号的记录。  \n- **该端从没成功过** → 没有上次，X-1／真换机 **都不踩**，去问 5／问 6。  \n- **环境记录已过 721 小时** → 这条不算该端已有记录；独特改对照账号（只加分，不踩红线）。\n\n| 编号 | 红线 | 说明 |\n| --- | --- | --- |\n| X-1 | 设备号未授信，**且** 没有同一浏览器痕迹，**且** 本次 IP 不在该账号常用／最近成功里，**且** **该端已有记录**的操作系统或屏幕档 **明确读到且对不上** | 典型：新设备 + 新网络。出口跳了不踩。该端没有记录、或只是对照账号对不上，**不踩**，去打分 |\n| X-2 | **登录国家** 与该账号记过的 **常用国家**、**上次成功国家** 都不相同（本次读到的才比） | **换国家一定发一次**。痕迹挡不住。过期的环境记录 **仍用来比国家**（只比国家，不拿去打分／当常用）。对上其中任一就不踩。避免出差刚验过、常用还没翻过来又天天验。本次国家读不到才不当不一致 |\n| X-3 | 后台 **删除了某条设备授信** 之后，这条对应环境的下一次 | 按**被删的那条设备号**认，不是整号所有端都验。号还对得上 → 发一次（**痕迹挡不住**）。H5 号已变对不上这条 → 不踩；未换国家则痕迹还在走已信任。痕迹不用后台清。**发出没登录成功＝没消耗**，再来仍踩。**填对登录成功**后这条号重新进库。App／PC 壳下次同一号、未踩其它红线 → **已信任**；H5 靠这次留下的痕迹（网页号不单独免验） |\n| X-4 | 该账号授信满 10 台、按下面挤法被挤掉的那条设备号再来 | 被挤掉的号再出现仍要验（**痕迹挡不住**）。挤哪台：先看 **最近一次登录隔得最久**；两台这个时间相同 → 挤 **最先记进库** 的那条。不是「不管谁最近还在用、一律挤最早登记的」。同一号多次登录只更新最近登录时间，不新占一位。号已变对不上被挤那条 → 不踩 X-4。**发出没登录成功＝没消耗**，再来仍踩。**填对登录成功**后这条号按新号重新进库；库仍满 10 → **再挤**当前间隔最远的 **另一台**（刚回来的自己刚更新了登录时间，不会挤自己）。App／PC 壳下次同一号、未踩其它红线 → **已信任**；H5 靠这次留下的痕迹（网页号不单独免验） |\n| X-5 | **真换机**（定义见下） | 只认 **该端已有记录** 且操作系统大类变了（两边都读到）→ **发一次**（**号还在库、痕迹都挡不住**）。**认不出「重装」**。清缓存／重装／换显示器／屏幕变了 **都不** 叫真换机：App／PC 壳号还在库 → 已信任；网页号不单独免验，走打分或 X-1。**H5 设备号自己变了不算**。换端不拿另一端系统比。App 本来无痕迹，不能把「无痕迹＋屏幕变了」叫真换机。与 X-1 可同时成立，只发一次 |\n| X-6 | 绑手机后 **第一次** 用账号密码登录（现网就会拦的那次） | **该账号的下一次账号密码登录成功** 才消耗，不论哪端。中间先走手机号登录／代理手机登录不消耗。**发出码没登录成功＝没消耗**，下一次账号密码仍要验。与改造前一致，本期不放宽 |\n| X-7 | 该账号改过登录密码、解绑过手机之后的 **下一次** 账号密码登录 | **该账号的下一次账号密码登录成功** 才消耗，不论哪端。中间先走手机号登录／代理手机登录不消耗。**发出码没登录成功＝没消耗**，下一次仍要验。**只收紧这一次成功**，不是每个端各一次。过后按已信任／打分 |\n\n### 真换机定义\n\n只认用户能不能看出「换了一台设备」。跟的是 **该端上次**（该端最近一条环境记录），不是对照账号。H5 没有稳定的系统设备号，**不能**把 H5 设备号变了当成换机。\n\n| # | 算真换机（踩红线，发一次短信） | 说明 |\n| --- | --- | --- |\n| 1 | **该端已有记录**，且操作系统大类变了（两边都读到） | 大类＝iOS／Android／Windows／macOS。**iPadOS 算 iOS，鸿蒙算 Android**（读到鸿蒙或自报 Android 都归 Android，互切不算真换机）。不在四类的按读到的原文当一类。例：同一 H5 里上次是手机（iOS）、这次是电脑（Windows）＝真换机。H5 验过再去 **另一端** PC／App **不算**（不跨端比系统）。对照账号对不上 **不踩** |\n\n| # | **不算**真换机 | 走哪 |\n| --- | --- | --- |\n| 1 | 还是这个浏览器，只是 H5 设备号变了，**操作系统大类没变**，验过痕迹还在 | 第 4 问「已信任」，不发短信。系统大类变了走真换机，痕迹挡不住 |\n| 2 | 清了缓存／无痕／重装，痕迹没了，但操作系统大类没变 | 后端认不出「重装」。**App／PC 壳号还在库** → **已信任**。网页号不单独免验，走打分或 X-1 |\n| 3 | 同一操作系统大类里升级（如 iOS 小版本、Android 小版本） | 不算换机 |\n| 4 | 只换了浏览器、没换该端操作系统大类 | **不算**真换机。网页有痕迹 → 已信任；没痕迹走打分。App／PC 壳号在库 → 已信任 |\n| 5 | H5 验过之后改用 PC／App | **不算**真换机。没该端记录则对照账号同名项打分；对不上不加分 |\n| 6 | 换了显示器／屏幕档读到但对不上，系统大类没变 | **不算**真换机。**App／PC 壳号还在库** → **已信任**。网页没痕迹：自己的网再加还是这台机仍可能打分过；新网且不像这台走 X-1 |\n| 7 | **只换了主域名**，该端操作系统大类没变 | **不算**真换机。新域名通常无痕迹 → 同一套打分（异常 35）：已经账密认过、有自己的网不发；没有，或只走过手机号登录的第一次网页账密 → 发一次记住。系统大类变了走真换机那一行，不要套本条 |\n\nX-1 是「新网 + 不像这台 + 无痕迹」，和真换机并列，不要混成一条。出口跳了但还是这台，不走 X-1。\n\n## 已信任（不打分、直接免验）\n\n**已信任**＝未踩红线，且按端认下面的。与「授信」不是同一个词：授信只指设备号名单；已信任还包含浏览器痕迹。\n\n| 端 | 已信任怎么认 |\n| --- | --- |\n| **H5（网页）** | 只有这个浏览器里还有 **本账号痕迹**。网页设备号在库 **不单独免验**（号常变，网吧电脑也会进库） |\n| **PC 壳** | 号还在授信 10 台库，或本壳还有本账号痕迹 |\n| **App** | 号还在授信 10 台库 |\n\n命中已信任 → **不发码**。网页痕迹还在时，设备号变了也一样。  \n**清缓存／清站点数据本身不参与判定**；只认这次有没有痕迹、交上来的号在不在库（库只给 App／PC 壳单独免验）。  \n未踩红线且已信任，才进第 4 问绿框。换国家、删授信、**被挤的号再来**、改密／解绑后第一次、**真换机**（同一 H5 里系统大类变了），即使痕迹还在也先验一次。\n\nApp 无痕迹。登录成功后号已进设备号库；下次这个号还在 10 台里、未踩红线 → 已信任。这次号不在 10 台里 → 不能靠授信已信任。被删／被挤的那条号再来先踩 X-3／X-4；换了新号、未踩红线 → 走打分。\n\n**退出登录**：清掉这个浏览器里 **本账号** 痕迹；**不删** 环境记录。换账号不能用上一账号痕迹。网吧没退出就离开＝痕迹还在，算人还坐在这台机上。\n\n### 浏览器痕迹定义\n\n**浏览器痕迹**＝这个浏览器里，还留着「**这个账号**曾经二次验证通过，或免验成功登录」的记号。用来判断：还是不是当初验过的那个浏览器。**不是**设备号，**也不是** IP／国家／屏幕那些画像。  \n**H5 与 PC 必须隔离**：存储 key 带端标记。同一浏览器访问 H5 壳和 PC 壳也 **不能** 混认。  \n手机站（`m.`）和电脑站都是 **H5**，不是换端，也 **不是** 换系统大类。系统大类只看 iOS／Android／Windows／macOS。**手机打开电脑站会自动跳 `m.`**，落在手机页；不按「同手机开电脑站」造数。电脑上可以开两套网址，换网址只改页类型，大类通常仍是 Windows，**不**因此踩真换机。两边 **不** 另做痕迹互认：这个网址这个浏览器读得到痕迹，才算有痕迹。没踩红线：网页 **读得到痕迹** → **已信任**；网页号在库但没痕迹 → **打分**。App 号在库 → **已信任**。PC 壳号在库或本壳有痕迹 → **已信任**。同一 H5 里大类变了（例上次手机 iOS、这次电脑 Windows）才真换机，见异常 28。微信和系统浏览器仍不混认。\n\n**换主域名**（H5 手机页、H5 电脑页都适用。例：手机 `m.b123.com` → `m.b234.com`；电脑 `b123.com` → `b234.com`。不是同一站的 `m.`／电脑站，也不是 APP／PC 壳）  \n两个主域名之间 **痕迹不互认**。这个新域名通常读不到旧痕迹，网页号也不单独免验，所以一般 **不走已信任**。系统大类没变 → **不算**真换机、**不算**换端（仍是 H5）。未踩红线 → **同一套打分**：已经账密认过、有自己的网 → 不发；没有 → **发一次，填对记住**，下次这个新域名少发。**只走过手机号登录的第一次网页账密：这张网也不免验，换域名也发**（新域名、无痕迹，有疑似风险）。**不能**靠换域名免验。若这次网页痕迹还在、未踩红线 → 仍已信任。**系统大类变了**（例上次手机网页 iOS，这次电脑网页 Windows）→ 仍走真换机／异常 28，打分不能抵。在公共网、换国家仍发。三站各是各的域名，跨站未换国家时走本条，不另开规则。例子见「打分怎么过」、异常 35。\n\n| # | 算「有痕迹」 | 说明 |\n| --- | --- | --- |\n| 1 | 还是这个浏览器，**这个域名**还读得到本账号记号，本站数据没被清掉 | 用户没清缓存、没关无痕。换了主域名＝新域名读不到，不算有痕迹 |\n| 2 | 该账号上次在这个浏览器里 **二次验证填对通过**，或 **免验成功登录** | 只有通过才留下；填错不留 |\n| 3 | 记号还在 | **不按天过期**。还在就认，清掉才没 |\n\n| # | 算「没有痕迹」 | 说明 |\n| --- | --- | --- |\n| 1 | 清了缓存／网站数据 | 记号没了 |\n| 2 | 无痕／隐私模式 | 关窗就没 |\n| 3 | 换了另一个浏览器 | Chrome 和 Safari 不是同一套 |\n| 4 | 微信内置页和系统浏览器 | **不是**同一套，不能混认 |\n| 5 | 这个账号从未在这个浏览器里 **二次验证填对** 或 **免验成功** | 没有可认的记号。手机号登录成功 **不算** 有痕迹 |\n| 6 | 上次验证码填错 | 不算通过，不留痕迹 |\n| 7 | **换了主域名** | H5 手机、H5 电脑都算。例：`m.b123.com` → `m.b234.com`，或 `b123.com` → `b234.com`。新域名读不到旧痕迹 |\n| 8 | **退出登录** | 清掉本账号在这个浏览器的痕迹 |\n\n| # | **不是**浏览器痕迹 | 走哪 |\n| --- | --- | --- |\n| 1 | H5 设备号 | 号可以变；痕迹还在仍走「已信任」 |\n| 2 | IP、国家、屏幕、系统等 | 那是账号下的画像，用来打分，不是「这个浏览器是否已信任」 |\n| 3 | 别的账号留下的记号 | 只认 **本账号**。A 的痕迹不能给 B 用 |\n\n## 本期可用条件（只此一张）\n\n结果上能对照的事实，全部在这张表。**不向用户要授权**。没写的不当对照。  \n已信任命中则不打分。打分按下面加总，**不是**各项随便累加到 60。  \n**交到的用，没交的当缺项**（不加分、不单独当红线）。  \n**不是打开登录页去判这张表**（见「登录无感知（时长）」）。1～2 是已信任（问 4）；3～5 服务端地址就能用；7、9、10、18、19 才是客户端点登录时交的打分项。第 6、8、11～16、20 行 **本期不采、不加、不扣**（对满 60 没用，扣分还会多发码），表里不列。刚验过不到 30 天 **不能单靠这一条免验**，不单列。\n\n**怎么读来源**\n- **公用**：账号上同一份，哪个端来都参考。\n- **独有**：该端有上次 → 只跟该端这条比。这条当时某项是 **缺项**，这次交到了也 **不加**（没得比），**不**改对照账号上别的记录。该端没有或整条过期 → **口径一致的同名项**跟账号近 30 天**任一次**成功记录比（对上一次就给该项分；只加分；对不上不加，不踩真换机）。型号不拿网页去对 App。\n- 微信内置页算 **H5**。自家 App 里打开的登录页算 **App**。微信和系统浏览器：**痕迹各认各的**；环境记录都记 H5，独特项会互相比。\n\n### 各端能交什么（不向用户要授权）\n\n| 信息 | 公用或独有 | H5 | PC | App |\n| --- | --- | --- | --- | --- |\n| 授信（设备号在不在名单里） | **公用**（名单一份，对的是**这次交上来的设备号**） | 有 | 有 | 有（现网主要靠这个） |\n| 本次／常用／上次 IP | **公用** | 有 | 有 | 有 |\n| 本次／常用／上次国家 | **公用** | 有 | 有 | 有 |\n| 设备号 | 各端自己交，名单公用 | 有，**常变** | 有，比 H5 稳，仍是网页号 | 有，**相对稳** |\n| 浏览器痕迹 | **H5／PC 独有** | 有 | 有（和 H5 不是同一套） | **无** |\n| 操作系统 | **各端独有** | 有 | 有（Windows／macOS） | 有（iOS／Android） |\n| 屏幕档、像素比 | **各端独有** | 有 | 有（换显示器会变） | **有**（不用授权；交不上才缺项） |\n| 显卡档 | **PC 独有**；**有像素比不采** | 电脑页：像素比交不上且能马上交到才用 | 同上 | **无** |\n| 设备型号 | **App 独有** | **无**（网页读不准） | **无** | **有**（哪一款手机／平板） |\n\n**本期不采（对满 60 没用）：** 城市打分、页类型打分、时区、语言、品牌、核数、内存。页类型只按最终网址认端（服务端），客户端不交来打分。城市服务端解析了可以记在环境记录里，**不打分**。\n\n**显卡档（锁死）**：先抽出 **核心型号** 再比。例：`ANGLE (NVIDIA, NVIDIA GeForce RTX 4060 Direct3D11 vs_5_0)` 与 `NVIDIA GeForce RTX 4060 Laptop GPU` 都是 **RTX 4060**。去掉 ANGLE、Direct3D、括号、Laptop、刷新率。**4060 与 4060 Ti 仍是两台机**（Ti／Super 算在核心型号里）。抽不出来（如 SwiftShader）当缺项，不加分。**像素比交到了就不采显卡**；像素比交不上且能马上交到才用。H5 电脑页交到了记在 **H5** 下。手机和电脑不要拿型号去对显卡。  \n**设备型号**：按 **市面型号** 比。举例即可，**正文不列机型清单、不交付对照表**。**iPhone 15 与 iPhone 15 Pro 是两款机**；`15.2` 这种小版本归市面 15。Android 同样（S23 ≠ S23 Ultra）。交到内部码：有研发对照表则映射到市面再比；**没表或映射不到**按去空格后的字符串比。**文中代号不当官方码表**。网页不当这项。不另开待交付，不挡测试。  \n**屏幕档**：先把宽高按数值排序（转屏同一档），再比。**本期就按这个比，不再另出区间表**：排序后宽高全等，或各边相差不超过 8 像素，算同一档。\n\n**本期各端按上表交**（不向用户要授权）。账密登录、手机号登录 **同一套字段**：成功时能交的记进环境记录，交不到＝缺项。手机号登录 **不交、也不下发二次验证痕迹**（只限痕迹，字段照交）。相对现网要补齐的：H5／PC 交痕迹（仅账密通过／免验）与系统／屏幕／像素比；像素比交不上才交显卡；App 交屏幕、像素比、设备型号。老版本交不上＝缺项。  \n时长、打开页不采齐、对 60 没用的不采，见 **「登录无感知（时长）」**。显卡有像素比就不采。\n\n上表没写的（精确定位、通讯录、广告标识等要授权的）**不当对照**。\n\n### 采集时怎么取（按这个交，避免各端各写各的）\n\n| 项 | 怎么取 | 不要 |\n| --- | --- | --- |\n| IP／国家 | **服务端**按现网看到的客户地址 + 现网 IP 库。解析失败＝读不到。**两个不一样的地址就是两个 IP**（同一字符串才算同一个）。IPv4 与 IPv6 也按这个，不另做「同一出口」。城市解析了可记，**不打分** | 不要用客户端自报 IP 打分；不要把不同地址自行合成一个；不要为打分采时区／语言／核数／内存 |\n| 端 | 以登录壳为准：微信内置＝H5；自家 App WebView＝App；PC 壳＝PC。请求带端标识，服务端按壳校验 | 不要只信客户端随便填的端 |\n| 操作系统大类 | **各端取该端能拿到的、更贴近的那一个**，服务端再归四类。**App**：系统 API（Android `Build`／iOS `UIDevice`），比 WebView UA 真，不要用 WebView UA。**H5／PC**：网页拿不到系统 API，按浏览器 UA 取（有 `userAgentData.platform` 用它，没有就解析 UA）。读到 HarmonyOS／鸿蒙 → 归 **Android**；读到就是 Android → 也归 Android | 不要让用户手填；不要跨端换源（App 不要改用 UA，H5 不要假装能读系统 API） |\n| 屏幕档 | `screen` 宽高（屏幕，不是窗口）。先排序再比 | 不要报 `innerWidth`（软键盘、窗口缩放会变） |\n| 像素比 | `devicePixelRatio`。浏览器缩放可能改变它，**可能不够 60**，接受 | 不要用 CSS 缩放后的视口去换算屏幕 |\n| 显卡档 | **仅像素比交不上时**才读。从渲染器名称抽出 **核心型号** 再比。**4060 ≠ 4060 Ti**。读不到或等太久＝缺项，**不要卡住点登录** | 不要有像素比还去采显卡；不要拿整段 ANGLE／Direct3D 原文去全等；不要打开登录页先读完再让人点登录 |\n| 页类型 | **服务端**按最终网址认：主机名加 **m**＝手机页；电脑站／PC 壳＝电脑页。客户端 **不交来打分** | 不要为打分采页类型；不要用 UA 猜 |\n| 痕迹 | 服务端在通过／免验成功后下发，存本浏览器；key 带 **账号 + 端**。**退出登录清掉本账号痕迹**。m 站和电脑站 **不** 另做互认 | 不要用上一账号的记号；不要让 H5／PC 共用一个 key；不要为了互认去种父域开绿灯 |\n\n客户端交的系统／屏幕等 **改得了**，只用来少发骚扰码。防盗靠红线 + 短信。老版本交不上＝缺项，接口 **不因缺项报错**。  \n系统大类分两层，不打架：① **怎么读**：各端取更贴近的（App＝系统 API，H5／PC＝浏览器 UA）。② **跟谁比**：只跟 **该端上次环境记录** 里已归好的大类比。该端始终用自己那一套读写（App 对 App 都是 API，H5 对 H5 都是 UA），登录成功时按这套写入。鸿蒙＝Android。没有该端环境记录就不比、不踩真换机。判定时不再另选「哪个源更真」。\n\n**登录请求交什么（缺了不报错，当缺项）**  \n账密登录、手机号登录 **同一张表**。IP／国家由 **服务端** 按现网地址取，客户端不要自报来打分。请求带端标识，服务端按壳校验。手机号登录成功且绑得上账号，按这张表记画像；交不到当缺项。浏览器痕迹只在账密通过／免验后下发，手机号登录不带、不下发。  \n**不要交：** 时区、语言、品牌、核数、内存、页类型（页类型服务端按网址认）。时机见 **「登录无感知（时长）」**。\n\n| 字段 | H5 | PC | App | 说明 |\n| --- | --- | --- | --- | --- |\n| 端标识 | 要 | 要 | 要 | 服务端按壳校验 |\n| 设备号 | 要 | 要 | 要 | 网页号常变也照交 |\n| 操作系统 | 要（UA） | 要（UA） | 要（系统 API） | 各端取更贴近的；服务端归四类。鸿蒙＝Android |\n| 屏幕宽高、像素比 | 要 | 要 | 要 | App 交不上＝缺项 |\n| 显卡档 | 像素比交不上且能马上交到才交 | 同左 | 无 | 有像素比 **不采**。等太久＝缺项，不卡登录 |\n| 设备型号 | 无 | 无 | 要 | 网页不当这项 |\n| 浏览器痕迹 | 有则带 | 有则带 | 无 | 服务端下发；没有＝无痕迹 |\n\n### 条件与分值\n\n| # | 条件 | 来源 | 优先级 | 怎么用 | 分 | 说明 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | **设备号已授信** | **公用** | 最高 | App／PC 壳：未踩红线才已信任免验。**网页号不单独免验** | — | 账号名单仍记网页号（挤满 10、X-3／X-4）。网页免验靠痕迹 |\n| 2 | **浏览器痕迹** | **H5／PC 独有** | 最高 | 未踩红线才已信任免验 | — | 只认本浏览器。H5 与 PC 不混认。App **无此项**。微信内置页和系统浏览器不是同一套。先走问 3。**退出登录清掉** |\n| 3 | **本次 IP＝上次成功时的 IP** | **公用** | 高 | 打分 | **22** | 与第 4 行取高。**两个不一样的地址就是两个 IP**，字符串全等才给这 22。不跟端走。**公共出口不加**（网吧／机场／酒店／商场 WiFi、机房／代理），即使＝上次成功 |\n| 4 | **IP 在近 30 天常用里** | **公用** | 高 | 打分 | **18** | 与第 3 行取高。常用＝该账号近 30 天成功出现过、**且不是公共出口** 的 IP。不另设次数门槛。公共出口成功过也不进常用 |\n| 5 | **登录国家相同** | **公用** | 确认 | 打分；与记过的国家都不同才走红线 | **5** | **打分只认未过期** 的常用／上次成功。**X-2 比国家：过期的也要比**，换国家一定发。对上未过期任一才给这 5 分 |\n| 7 | **操作系统大类相同** | **各端独有** | 中（还是这台） | 打分；**该端已有记录**且大类变了＝真换机 | **20** | 打分按 **大类**（iOS／Android／Windows／macOS；**iPadOS＝iOS，鸿蒙＝Android**）。不在四类的按读到的原文当一类。小版本不同仍给这 20。该端有上次跟该端这条比（该条缺项这次交到了也不加）；没有或整条过期则跟账号近 30 天任一次成功记录比（对不上不加分，不踩真换机） |\n| 9 | **屏幕宽高同一档** | **各端独有** | 中（还是这台） | 打分 | **20** | 该端有上次跟该端这条比（该条缺项这次交到了也不加）；没有或整条过期可跟账号任一次成功记录比。转屏先排序再比。PC 换显示器可能变档，**不**单独当真换机 |\n| 10 | **屏幕像素比相同** | **各端独有** | 中（还是这台） | 打分 | **16** | 和系统、屏幕档一起认同一台。App 要交；交不上可用第 18 行型号替代 |\n| 18 | **设备型号相同** | **App 独有** | 中（还是这台） | 打分 | **16** | 按市面型号。15 与 15 Pro **不加**；15 与 15.2 **加**。内部码：有表映射到 15 才加，没表按字符串。网页不加这项。可与像素比二选一 |\n| 19 | **显卡档相同** | **PC 独有** | 中（还是这台） | 打分 | **16** | **有像素比不采、不加。** 像素比交不上且能马上交到才比。抽核心型号；4060 与 4060 Ti **不加**。H5 电脑页同样。可与像素比二选一 |\n\n### 容易看成同一条（对照用，不是重复条件）\n\n上表没有把同一件事写两遍。名字接近的各管各的，**不要合成一行，也不要判两次**。\n\n| 容易混成一条 | 其实不是 | 各管什么 | 怎么用 |\n| --- | --- | --- | --- |\n| **浏览器痕迹** ＝ **手机页／电脑页** | 不是 | 痕迹＝这个浏览器里还有没有「本账号验过／免验成功」的记号。页类型＝最终落到手机站还是电脑站 | 痕迹走第 4 问已信任。页类型只按网址认端，**本期不打分** |\n| **H5／PC／App** ＝ **手机页／电脑页** | 不是 | 端＝登录壳。页类型＝网址（`m.`＝手机页，电脑站／PC 壳＝电脑页） | 手机站和电脑站都是 **H5**，不是换端。手机打开电脑站会跳 `m.`，仍算手机页。**PC 端** ≠ **电脑页** |\n| **设备号授信** ＝ **浏览器痕迹** | 不是 | 号在库＝这台机进过 10 台名单（App／PC 壳可已信任）。痕迹＝这个浏览器验过（网页靠这个） | 网页号不单独免验。退出登录清痕迹 |\n| **系统大类 20 分** ＝ **真换机** | 同一信号，两处用 | 打分认「还是这台」；该端上次大类变了＝红线 | 真换机时痕迹也挡不住。屏幕变了 **不算** 真换机 |\n\n城市、时区、语言、品牌、核数、内存、页类型打分 **本期不采**。它们堆不满 60，采了也帮不上少发码。\n\n### 两张网（家里／公共）\n\n打分里的「自己的网」不是「看起来像家里」就过。分两层，都由 **服务端看这次地址**，登录页不再采。认不出公共类型 → **不当公共网**；要当「自己的网」仍须这账号用过这张 IP。\n\n| 层 | 认什么 | 过了算什么 |\n| --- | --- | --- |\n| 1 出口类型 | 网吧／机场／酒店／商场 WiFi／机房／代理＝**公共网** | 第 3／4 行 **不加**、**不进** 常用。无痕迹 → 发。换主域名也发 |\n| 2 是不是这账号的 | 本次 IP＝上次成功，或在近 30 天常用里 | 才叫 **自己的网（家里／自己手机流量）**。还要第 1 层不是公共网 |\n\n私人网但第 2 层对不上（弱网跳了、别人家里）：**发一次**，换主域名也发。填对记住，下次少发。不能把第 1 层「不是公共网」当成第 2 层「自己的网」。\n\n### 加总规则（一条一行）\n\n| # | 规则 |\n| --- | --- |\n| 1 | 第 3、4 行同一大类，只取较高一档，不同时加满 |\n| 2 | 打分按表加总。过线须 **≥60 且第 3 或 不上） | 自己的网：22+5＝27 | **发一次**。填对后下次这台 PC 已信任 |\n| 这个浏览器验过，痕迹还在，**未踩红线** | 不打分 | **已信任**。设备号再变也不打分 |\n| 完全没历史 | 没法比 | 问 5 发一次。App／PC 壳号还在库 → 已信任 |\n| 只走过手机号登录，第一次账密、**同一设备号** | App／PC 壳号在库 | **已信任**。H5 无痕迹 → **走打分，自己的网也不免验，发一次**，填对记住 |\n| 只走过手机号登录，第一次账密、**设备号已变** | 有画像可打分 | **发一次**（不能因这张网免验）。不当完全没历史 |\n\nApp 缺屏：像素比缺了用 **型号** 顶第三项。过线仍须 **自己的网** 或已信任。公共出口／无 IP 则发一次。\n\n## 通过后必须记住（不断档）\n\n**以登录成功为计算依据**：画像、该端已有记录、文中所有「上次」、常用、痕迹、设备号入库、X-3／X-4／X-6／X-7 是否消耗，都只在 **真正登录成功** 之后算。没成功登录，不写、不消耗。发出验证码 ≠ 登录成功。两套不要混。\n\n二次验证 **通过**、打分／已信任 **免验成功登录**，或 **手机号登录成功且绑得上账号**：只 **追加一条环境记录**（这条 **一定写端**，公用、独特都写在这条里，含系统／屏幕／像素比，App 设备型号；显卡仅像素比交不上且交到了才写）。**不另存一行覆盖**。读到的才记。账密通过／免验时 H5／PC 还要留本浏览器痕迹；**手机号登录不留二次验证痕迹**。App 不留浏览器痕迹。常用／上次／该端上次都从这些环境记录取，见下表。\n\n**设备号库和授信 10 台是同一套**  \n下面两种成功都把这次的设备号记进库：账密填对或免验；**手机号登录成功且绑得上账号**。同一号只 **更新最近登录时间**，不新占一位；新号 **追加**，旧号不盖掉。  \n不同设备满 **10 台** 再来新号：先挤 **最近一次登录隔得最久** 的那一台。两台这个时间相同（含同时登录）→ 挤 **最先记进库** 的那条（入库顺序靠前的）。不是「最近还在用的也按最早登记挤掉」。每条设备号都有入库顺序，时间并列时按这个排。被挤的号 **填对重新进库**＝按新号追加；库仍满 10 → **再挤**当前间隔最远的另一台（刚回来的自己不会挤自己）。**同一套库、同一挤法**。后台删某条仍按现网。手机号登录没登录成功（没绑账号或发出码没填）：不进库。代理不因本期记画像；若现网把号写入这库，挤法同上。  \n已信任（设备号这条）：**只认 App／PC 壳**这次交上来的号还在这 10 台里（没被挤、没被删）。**网页号不单独免验。** 每条一定有端。环境记录：账密成功记；手机号登录成功且绑得上也记。没登录成功不记。\n\n记下的是 **登录成功当时** 的环境，不是点登录当时。新环境记录某项读不到＝这条缺项，**不要去改更早的环境记录**。\n\n**怎么存（按这个做，避免只留一行把历史盖掉）**  \n账密通过／免验成功，或手机号登录成功且绑得上账号：往该账号 **追加一条环境记录**（**端一定有**，另写时间、IP、国家、**设备号**、该次读到的独特项；城市解析了可记、**不打分**），设备号同时写入上面的 10 台库。保留从成功时刻起 **720 小时**（文中「30 天」＝这个，按服务器时间）。没有成功登录，不追加、不进库。没绑账号＝手机号登录进不去，没有后续账密。\n\n| 比什么 | 取哪条 |\n| --- | --- |\n| **该端上次** | 该端最近一条未过期环境记录（这条一定有端）。该端有上次 → 独特 **只** 跟这条比。这条某项当时缺项，这次交到了也 **不加**，不改对照账号 |\n| **对照账号** | 该端 **没有** 或整条过期时，才用未过期环境记录里 **任一条** 的同名项，对上一次就给该项分 |\n| **上次成功国家／IP**（打分、常用） | 账号最近一条 **未过期** 环境记录（哪一端都行） |\n| **常用国家** | 未过期环境记录里出现最多；并列取最近 |\n| **常用 IP** | 未过期环境记录里出现过、**且不是公共出口** 的才算 |\n| **比国家（只给 X-2）** | 账号 **记过的** 常用／上次成功国家，**过期的也要比**。和这次都不同 → 发一次。痕迹挡不住 |\n\n过期环境记录：不参与常用、打分、上次成功（打分用）。**比国家踩 X-2 时，过期的也要比**：记过的国家和这次都不同 → **发一次**。痕迹挡不住。退出登录 **不删** 环境  【必测】TC-05 | 删授信 | 后台删设备 A，仍用设备号 A 登录；填对登录成功；再用同一号 A 再登（未踩其它红线）。分造 App／H5 | 第一次 **发码**。填对后号重新进库。**App／PC 壳**第二次同一设备号 **已信任**；**H5** 靠这次痕迹。不得写成网页认库 |\n| 【必测】TC-05b | 删授信号已变 | 后台删设备 A，H5 号已变对不上 A，痕迹还在 | **不**踩 X-3；未换国家则已信任不发 |\n| 【必测】TC-06 | 换机 | **该端已有环境记录**。新机无痕迹；系统大类变了或（新网且屏幕读到对不上） | 发码（X-5 或 X-1）。同档无 IP 仍发码见 TC-11b／TC-35 |\n| 【必测】TC-07 | 多次登录 | TC-02 之后当天再登多次 | 一直不发码，一直能登 |\n| 【必测】TC-08 | 其它 OTP | 改密／绑卡发码 | 与改造前一致 |\n| 【必测】TC-09 | 三站同一套 | 中国／越南／国际各走一遍主路径 | 判定相同，不按站分支 |\n| 【必测】TC-10 | 互切痕迹不带 | H5 已免验（靠痕迹），换 App 且未授信、**系统对不上**（如 H5 是电脑页） | **不**因 H5 痕迹免验；**不**踩跨端真换机；打分不够 60，App **发码**。同机对得上见 TC-26b |\n| 【必测】TC-11 | 号已变、还是这台 | **该端已有独特记录**。清 **站点数据**（痕迹没了，**新号不在库**），自己的网、同国家、同系统、屏幕同一档 | 号不在库，打分 ≥60 且自己的网，不发码。网页只清痕迹、同一号还在库 → **仍打分**（不单独已信任） |\n| 【必测】TC-11b | 出口跳动、同档不够 | 清 **站点数据**、**新号不在库**，IP 不在常用，同国家、同系统、同屏幕档、像素比相同 | **不踩 X-1**，61 不够，**发码**。填对后再登：网页靠痕迹 **已信任** |\n| 【必测】TC-12 | 密码对、环境不对 | 正确账号密码 + X-1（新网且不像这台） | 必须发码，不能因密码对而免验 |\n| 【必测】TC-13 | 验过记住 | TC-03 通过后再登，设备号又变、痕迹还在 | **不发码**（已信任），不得再从零打分 |\n| 【必测】TC-14 | 首次无画像 | 无授信、无痕迹、无本期环境记录 | 发一次。填对后号进库、留痕迹。同一浏览器再登 **已信任，不打分**。现网已有授信则走 TC-01，不走本条 |\n| 【必测】TC-15 | 验证码填错 | 已发二次验证码，故意填错 | 与改造前该页一致；不登录、不记住环境 |\n| 【必测】TC-17 | 手机换电脑 | H5 手机验过后改用 PC，系统对不上；填对登录成功；再用这台 PC 再登（未踩其它红线） | **不**踩真换机；第一次打分不够 60，**发一次**。填对后号进库、留痕迹。第二次 **已信任，不打分**。已授信则第一次也不发 |\n| 【必测】TC-18 | 缺项不当对不上 | 清站点数据、**新号不在库**，出口跳了，系统／屏幕读不到 | 不踩 X-1；打分缺项不加；不够 60 才发一次。网页只清痕迹不单独已信任。App／PC 壳号还在库 → **已信任** |\n| 【必测】TC-19 | 免验也记号 | 分造，不要夹在一条：① **新号不在库**，满 60 **且自己的网** 免验；② **App／PC 壳号已在库**、未踩红线；③ **H5 痕迹还在** | 都能登；**都追加一条环境记录**。① 新号进库。② 该号只更新时间。③ 网页靠痕迹，不是靠号在库。同档无 IP／公共出口不走本条 ① |\n| 【必测】TC-20 | 改密只收紧一次 | 改密后第一次账号密码登录发码并通过；立刻再登且痕迹还在 | 第一次发码；第二次 **不发** |\n| 【必测】TC-21 | 出差后常用未翻 | 验过泰国后，常用仍是越南，再从泰国登 | **不踩 X-2**（已是上次成功国家） |\n| 【必测】TC-22 | 手机号登录后同一设备号账密 | 该手机号已绑账号。手机号登录成功（设备号进库、**不**留痕迹），再走账号密码（未踩 X-6／X-7）。分造 App／H5；H5 分造家里网／公共网。换主域名另见 TC-43 ⑥ | 手机号登录不进 6 问、必发码、**不**留痕迹。**App** 同一设备号 → **已信任，不发码**。**H5** 走打分：家里网／公共网都 **发一次**，填对后再登不发。不得写成 H5 认库免验，也不得写成家里网免验。换了主域名仍发，见 TC-43 ⑥ |\n| 【必测】TC-23 | 删授信只作用于那条 | 后台只删设备 A，用已授信设备 B 登录 | B **不发**（未踩 X-3） |\n| 【必测】TC-24 | X-6 绑手机后第一次 | 刚绑手机，第一次账号密码登录 | 发码（与现网一致） |\n| 【必测】TC-24b | X-6 不被手机号消耗 | 刚绑手机，先走手机号登录成功，再走账号密码（**不必清缓存**；红线先于已信任） | **仍发码**（X-6 没被消耗）。画像可以记，不能抵 X-6 |\n| 【必测】TC-24c | X-7 不被手机号消耗 | 刚改密／解绑，先走手机号登录成功，再走账号密码（**不必清缓存**） | **仍发码**（X-7 没被消耗） |\n| 【必测】TC-15b | 发出码没登成 | 已出二次验证页，关页或不填，再走账号密码。分别造：刚绑手机、刚改密／解绑、后台刚删这条授信、刚被挤掉的那条号再来 | **无**新环境记录、**无**新痕迹。X-3／X-4／X-6／X-7 **仍踩**。再登从第 1 问重走，不得当已验过 |\n| 【必测】TC-25 | 出差后号已变 | 常用越南、上次成功泰国，清站点数据、**新号不在库**，从泰国登，该端系统＋屏幕＋像素比还对 | 不踩 X-2；国家给 5 分；打分 ≥60 **且自己的网**，**不发码**。本期不扣语言。网页只清痕迹不单独已信任 |\n| 【必测】TC-26 | App 同档无 IP | App 未授信、号不在库，IP 不在常用；**同国家**＋系统＋屏幕＋型号还对 | **发码**（61 不够）。号在库，或自己的网再加还是这台机 → 不发 |\n| 【必测】TC-26b | 同机换 App | H5 手机已验过，再开 App，号不在库、IP 不在常用，同国家＋系统＋屏幕＋像素比还对 | **发码**（61 不够）。号已在库，或自己的网再加还是这台机 → 不发。不踩真换机 |\n| 【必测】TC-29 | 同机换 PC | H5 电脑页已验过，再开 PC，号不在库、IP 不在常用 | **发码**（61 不够）。号在库，或自己的网再加还是这台机 → 不发。不必等显卡 |\n| 【必测】TC-27 | App 内嵌页 | 自家 App 内打开登录页，H5 痕迹还在 | 算 App，**不**因 H5 痕迹免验 |\n| 【必测】TC-28 | 改密后换端 | 改密后 H5 已验过，立刻用已授信 App 登 | **不**再因 X-7 发码 |\n| 【必测】TC-30 | H5 内换系统 | 同一账号 H5：上次手机 iOS 已有环境记录，这次电脑页 Windows，无授信；**痕迹还在也要测一遍** | **踩真换机，发码**（先红线，痕迹挡不住）。不要当成「换端」 |\n| 【必测】TC-31 | 换账号 | 浏览器里 A 已有痕迹，退出后用 B 的账号密码登录 | **不**因 A 的痕迹免验 |\n| 【必测】TC-32 | 登出再登 | 填对或免验后退出，同一浏览器同一账号再密码登录，未踩红线。分造：自己的网＋还是这台机／公共网 | **痕迹已清**（退出清痕迹，不要写成痕迹还在）。网页走打分：自己的网再加还是这台机 → **不发**；公共网 → **发一次**。App／PC 壳号在库 → **不发** |\n| 【必测】TC-33 | 微信和系统浏览器 | 系统浏览器已有 H5 痕迹，微信内置页同账号登录 | **不**混认痕迹；按微信当 H5 重判 |\n| 【必测】TC-34 | 环境记录过期 | 上次成功国家在 721 小时前，常用也过期。分造：① **换国家**（痕迹还在／已清都要造）② 未换国家、痕迹还在或 App／PC 壳号还在库 ③ 未换国家、痕迹已清、**新号不在库** | ① **踩 X-2，发码**（过期仍比国家，痕迹挡不住）。② **不踩 X-2**，已信任不发。③ **不踩 X-2**，无未过期画像 → 问 5 **发码**。不要写成过期换国家走问 5、不踩红线 |\n| 【必测】TC-35 | 同档无 IP 仍发 | 未授信无痕迹，IP 不在常用，**同国家**＋系统＋屏幕＋像素比还对（61），设备时区是美国 | **发码**（61 不够，与时区无关）。本期不采时区。号在库，或自己的网再加还是这台机 → 不发 |\n| 【必测】TC-36 | 第三项只取一档 | App **未授信、号不在库**，像素比和型号都对 | 第三项只加 **16**，不是 32。号还在库 → **已信任**，测的不是打分 |\n| 【必测】TC-37 | 主项对不上堆不满 | **未授信、号不在库**、无痕迹，无 IP、系统或屏幕对不上 | 本期无低档可堆，不够 60，**发码**。号还在库 → **已信任**，不走本条 |\n| 【必测】TC-38 | X-4 挤掉 | 先造 10 台，最近登录时间拉开；再来第 11 个新号登录成功。再用被挤那台号来（痕迹还在也要测）；填对登录成功；再用同一号再登（未踩其它红线）。另造：两台最近登录时间相同 | 被挤＝间隔最远那台，第一次 **发码**（X-4，痕迹挡不住）。填对后号重新进库；库仍满 10 → **再挤**当前间隔最远的另一台（不挤刚回来的自己）。第二次同一号 **已信任，不发码**。时间相同则挤最先记进库的。不要挤「最早入库但最近还在用」的。换了新号对不上被挤那条 → 不踩 X-4 |\n| 【必测】TC-39 | 解绑后下一次 | 解绑手机后第一次账号密码登录 | **发码**（X-7）。再登不因解绑再发 |\n| 【必测】TC-40 | 型号不是同一档 | App **未授信、号不在库**，IP 不在常用；上次 iPhone 15，这次 15 Pro；像素比还对 | 型号不加。仍是 61，**发码**。号还在库 → **已信任** |\n| 【必测】TC-40b | 型号小版本归市面 | App 上次 iPhone 15，这次交 15.2 | 第 18 行 **加**（市面 15）。不测对照表、不等人交机型清单 |\n| 【必测】TC-41 | IPv4 换 IPv6 | 清站点数据、**新号不在库**，上次成功是 `1.2.3.4`，这次是 `240e:…`，同国家＋系统＋屏幕＋第三项还对 | **两个地址＝两个 IP**；61 不够，**发码**。网页只清痕迹不单独已信任。App／PC 壳号还在库 → **已信任** |\n| 【必测】TC-42 | 该端上次缺项不对照账号 | 该端先成功一回，那条屏幕写成缺项；账号上另有记录屏幕能对上。这次号不在库、无痕迹、出口跳了，系统＋屏幕＋像素比都交到 | 屏幕 **不加**（只跟该端上次缺项比，不拿账号上别的记录补）。5+20+16＝41，**发码**。不要加成 61 |\n| 【必测】TC-43 | 换主域名 | H5 **手机、电脑各一遍**。新号不在库、新域名无痕迹，系统大类没变。分造：① 已经账密认过、有自己的网 ② 弱网出口跳了、号也变了、同档还对 ③ 公共网 ④ 换国家 ⑤ 上次 iOS 这次 Windows ⑥ **只走过手机号登录**，第一次网页账密就换域名、有自己的网。② 填对后再登同一新域名 | ① **不发码**（67）。② **第一次发码**，填对后再登 **不发**。③ **发码**。④ **发码**（X-2）。⑤ **发码**（真换机）。⑥ **发码**（这张网也不免验，不要因换域名＋家里网过掉）。不要写成换域名免验，也不要写成每次都当新设备反复发 |\n| 【必测】TC-44 | 登录无感知（时长） | 打开登录页；点登录须带系统／屏幕／像素比。另造：① 显卡交不上、像素比还在、**自己的网** ② 已信任 ③ 同档无 IP、填对后再登 | 打开页不比改造前空转。① **不发码**（自己的网再加还是这台机）。② 已信任直接进。③ 第一次发码，填对后已信任。不能只在快机上过。**不要**为防网吧再采一长串 |\n| 【必测】TC-45 | 公共出口 | 无痕迹、号不单独免验，服务端地址标成公共出口；同国家＋系统＋屏幕＋像素比还对。另造：这个地址上次成功过 | **发码**（不当自己的网，61 不够）。不要因为「常用／上次 IP」免验 |\n| 【必测】TC-46 | 网吧机器 | ① 网吧电脑账密成功后 **不退出**，旁人用同一账号密码 ② **退出**后再用同一账号 ③ 自己的 App 在网吧 WiFi | ① **不发**（痕迹还在，人还在这台机上）。② 网页 **发码**。③ App 号在库 **不发** |\n\n## 风险评估\n\n| 风险 | 会看见什么 | 应对 |\n| --- | --- | --- |\n| 免验条件过松 | 盗号有密码＋同档机，或网吧公共 IP、换域名免验进 | **多件一起中**。61 不够。公共网不当自己的网。网页号不单独免验。换域名不另开免验。先红线 |\n| 免验条件过严 | 同人因出口跳动＋清站点／换域名收码 | **已信任优先**；家里常用网仍免验。出口跳了又没痕迹会发一次，填对后不反复。和盗号分不开的那一次必须验 |\n| 只靠分数、验过不记住 | 每次从零算，一直要短信 | 通过后记住；有痕迹走已信任 |\n| 用次数停发 | 用户登不进去、客诉 | **不纳入** |\n| 把 H5 痕迹当成全端免验 | App／PC 少验 | **痕迹只认本浏览器**；换端看授信／自己的网再加还是这台机／填对后已信任 |\n| 把 H5 系统拿去卡 PC／App | 互切被当成换机，反复收码 | 不踩跨端真换机；号在库，或自己的网再加还是这台机才不发 |\n| 把换主域名当成新设备 | 同人换域名＋弱网跳 IP＋号变，反复收码 | **异常 35**：不算真换机。已经账密认过、有自己的网不发；没有发一次，填对后新域名不反复。只走过手机号登录的第一次网页账密仍发。网吧仍发。TC-43 |\n| 网页号常变挤满 10 台 | H5 号变了当新号，可能挤掉最久没来的真机 | 同一号只更新时间。新号才占一位。挤的是间隔最远的那台。号已变、未踩红线，痕迹还在可已信任。**被挤的那条号再来**踩 X-4，痕迹挡不住。填对后号重新进库；库仍满 10 → 再挤另一台。App／PC 壳下次同一号已信任；H5 靠这次痕迹 |\n| 缺项当对不上 | 读不到屏幕就当新设备，越南出口一跳又要码 | **缺项 ≠ 对不上** |\n| 打开登录页采齐条件再登录 | 进页慢、点登录空转；或为了快把系统／屏幕／像素比也省了，本人又反复收码 | **登录无感知**：条件多靠马上能交的叠齐，不是 20 条全齐。公共网不当通行证。C-51、C-52、TC-44 |\n\n## 已闭环\n\n原「已确认事项」「QA 关注点」结论已并入本表，不再另开两节。编号继续用 C-xx，方便回看。\n\n| 编号 | 事项 | 结论 | 状态 |\n| --- | --- | --- | --- |\n| C-01 | 免验门槛 | 未踩红线后：网页认痕迹；App／PC 壳认号在库。否则打分须 **≥60 且是自己的网**。**自己的网**＝这账号上次／常用且不是公共网。**61 不够。公共网不够。** 换主域名见 C-50：不另开过线，少发不免验。**只走过手机号登录的第一次网页账密：这张网也不免验，换域名也发**。国家读不到且无自己的网＝发码 | 已闭环 |\n| C-02 | 采集授权 | **不向用户要授权**。表里没有的不当对照 | 已闭环 |\n| C-03 | 缺项 | 没交／读不到／等太久＝缺项：不加分、不单独当红线。缺项 ≠ 对不上。**系统／屏幕／像素比／设备号／痕迹不能为了快故意不交**；缺的主要是显卡这种等太久的 | 已闭环 |\n| C-04 | 门槛数字 | **60 分暂定**，须与业务协商后锁定。文中「满 60」＝≥60。与 C-06 同一件事，不另立第二套门槛 | 已闭环 |\n| C-05 | 公用／独有 | 公用账号一份，哪个端来都参考。独特：该端有上次跟该端这条比；这条某项当时缺项，这次交到了也 **不加**，不改对照账号。没有或整条过期则口径一致的同名项对照账号近 30 天任一次 | 已闭环 |\n| C-06 | 门槛须协商 | **同 C-04**。上线前与业务确认 60 是否改。不另立第二套门槛 | 已闭环 |\n| C-07 | 多件一起中 | 同档四项不能单独免验；常用 IP 也不能单独免验（网吧会撞）。过线＝痕迹，或 App／PC 壳号在库，或 **自己的网再加中档**。公共网不当自己的网。「不是公共网」≠「自己的网」。换域名、落网、号变：少发不免验。不改成同城市 | 已闭环 |\n| C-08 | 互切 | 不踩跨端真换机。号在库，或自己的网再加还是这台机 → 不发。号不在库且 IP 不在常用 → 发一次。H5 痕迹不到 App／PC | 已闭环 |\n| C-09 | 6 问顺序 | 密码 → 现网其它校验 → 红线 → 已信任 → 有无画像 → 打分。分数不能抵红线 | 已闭环 |\n| C-10 | 真换机／系统大类 | 读和比是两层：各端取更贴近的（App＝API，H5／PC＝UA）；只跟该端上次环境记录的大类比。该端自己那一套，不另判哪个更真。鸿蒙＝Android，iPadOS＝iOS。互切不算真换机。**不另开必测**。认不出重装。换端不跨端比系统 | 已闭环 |\n| C-11 | 第三项三选一 | 像素比或 App 型号或（像素比交不上时）显卡，只取一档 16。有像素比不采显卡。这四项加起来仍是 61，**不够过线**，见 C-07。换主域名也一样 | 已闭环 |\n| C-12 | 同名项 | 可对：系统大类、屏幕档、像素比、显卡档。不对：痕迹、页类型、网页去对 App 型号。时区／语言／品牌／核数／内存本期不采 | 已闭环 |\n| C-13 | 语言／时区扣分 | **本期不采、不扣**。对满 60 没用，还会把家里网 67 打成发码。防盗靠红线＋多件一起中 | 已闭环 |\n| C-14 | 填错 | 按现网原逻辑；不记住环境 | 已闭环 |\n| C-16 | 不纳入 | 次数停发、取消验证、通         return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')

      function inlineFormat(text) {
        const priMap = { 必测: 'must-test', 必验: 'must-accept', 注意: 'note', 重要: 'important' }
        return escapeHtml(text)
          .replace(/【(必测|必验|注意|重要)】/g, (_, label) =>
            '<span class="pri pri-' + priMap[label] + '">' + label + '</span>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/==(.+?)==/g, '<mark class="hl">$1</mark>')
          .replace(/`(.+?)`/g, '<code>$1</code>')
      }
      function isPhoneShot(alt, srcPath) {
        const s = String(alt || '') + ' ' + String(srcPath || '')
        return /H5|手机|iPhone|iphone|phone|移动端|APP端|竖屏/i.test(s)
      }
      function renderMarkdownImage(alt, srcPath, assetBase) {
        const base = assetBase ? assetBase.replace(/\\/g, '/').replace(/\/?$/, '/') : ''
        if (!/^(https?:|data:)/i.test(srcPath) && !srcPath.startsWith('./') && !srcPath.startsWith('/')) {
          srcPath = base + srcPath
        } else if (srcPath.startsWith('./')) {
          const rest = srcPath.slice(2)
          const baseNoDot = base.replace(/^\.\//, '')
          srcPath = (baseNoDot && rest.startsWith(baseNoDot)) ? './' + rest : base + rest
        }
        if (/\.html?$/i.test(srcPath) || /^data:text\/html/i.test(srcPath)) {
          return (
            '<figure class="doc-proto"><iframe src="' + escapeHtml(srcPath) +
            '" title="' + escapeHtml(alt || '交互原型') +
            '" loading="lazy" scrolling="no" data-proto-frame="1"></iframe><figcaption class="cap">' +
            escapeHtml(alt || '交互原型') + '（本页内可直接操作）</figcaption></figure>'
          )
        }
        const phoneClass = isPhoneShot(alt, srcPath) ? ' is-phone' : ''
        return (
          '<figure class="doc-figure' + phoneClass + '"><img src="' + escapeHtml(srcPath) +
          '" alt="' + escapeHtml(alt) +
          '" loading="lazy" data-lightbox="1" title="点击放大查看" /><figcaption class="cap">' +
          escapeHtml(alt || '示意图') + '（点击可放大）</figcaption></figure>'
        )
      }
      function renderCompareBlock(body, assetBase) {
        const imgs = []
        const re = /!\[([^\]]*)\]\(([^)]+)\)/g
        let m
        while ((m = re.exec(body))) imgs.push(renderMarkdownImage(m[1], m[2].trim(), assetBase))
        if (!imgs.length) return renderMarkdown(body.trim(), assetBase)
        return imgs.join('')
      }
      function renderTabsBlock(body, assetBase) {
        const parts = String(body || '').trim().split(/^#{3,4}\s+/m).filter(Boolean)
        if (!parts.length) return ''
        const panes = parts.map((part) => {
          const nl = part.indexOf('\n')
          const title = (nl === -1 ? part : part.slice(0, nl)).trim()
          const rest = nl === -1 ? '' : part.slice(nl + 1)
          const imgs = renderCompareBlock(rest, assetBase)
          return { title, html: imgs ? '<div class="doc-compare">' + imgs + '</div>' : '' }
        })
        let bar = '<div class="doc-tab-bar" role="tablist">'
        let panesHtml = ''
        panes.forEach((p, i) => {
          const on = i === 0 ? ' is-on' : ''
          bar += '<button type="button" class="doc-tab-btn' + on + '" data-tab="' + i + '">' +
            escapeHtml(p.title) + '</button>'
          panesHtml += '<div class="doc-tab-pane' + on + '" data-pane="' + i + '">' + p.html + '</div>'
        })
        bar += '</div>'
        return '<div class="doc-tabs">' + bar + panesHtml + '</div>'
      }
      function renderMarkdown(src, assetBase) {
        let text = String(src || '').replace(/\r\n/g, '\n')
        const calloutStore = []
        const base = assetBase ? assetBase.replace(/\\/g, '/').replace(/\/?$/, '/') : ''
        text = text.replace(/:::(\w+)\s*\n([\s\S]*?)\n:::/g, (_, type, body) => {
          const idx = calloutStore.length
          if (type === 'compare') {
            calloutStore.push({ type: 'compare', html: renderCompareBlock(body, assetBase) })
          } else if (type === 'tabs') {
            calloutStore.push({ type: 'tabs', html: renderTabsBlock(body, assetBase) })
          } else {
            calloutStore.push({ type, html: renderMarkdown(body.trim(), assetBase) })
          }
          return '\n\n%%CALLOUT_' + idx + '%%\n\n'
        })
        const blocks = text.split(/\n{2,}/)
        const html = []
        for (let block of blocks) {
          block = block.trim()
          if (!block) continue
          const calloutRef = block.match(/^%%CALLOUT_(\d+)%%$/)
          if (calloutRef) {
            const item = calloutStore[Number(calloutRef[1])]
            if (item.type === 'compare') html.push('<div class="doc-compare">' + item.html + '</div>')
            else if (item.type === 'tabs') html.push(item.html)
            else html.push('<div class="callout callout-' + item.type + '">' + item.html + '</div>')
            continue
          }
          if (/^```/.test(block)) {
            const lines = block.split('\n')
            const code = lines.slice(1, lines[lines.length - 1] === '```' ? -1 : undefined).join('\n')
            html.push('<pre><code>' + escapeHtml(code) + '</code></pre>')
            continue
          }
          if (block.startsWith('# ')) { html.push('<h1>' + inlineFormat(block.slice(2)) + '</h1>'); continue }
          if (block.startsWith('## ')) { html.push('<h2>' + inlineFormat(block.slice(3)) + '</h2>'); continue }
          if (block.startsWith('### ')) { html.push('<h3>' + inlineFormat(block.slice(4)) + '</h3>'); continue }
          if (/^\|/.test(block) && block.includes('\n|')) {
            const rows = block.split('\n').filter((l) => /^\|/.test(l) && !/^\|\s*-+/.test(l))
            if (rows.length) {
              const parseRow = (row) =>
                row.replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim())
              const head = parseRow(rows[0])
              const isKv = head.length === 2 && head[0] === '项' && /^(内容|说明)$/.test(head[1])
              const nowrapCol = head.map((c) => /^(编号|#|日期|版本)$/.test(c))
              let table = '<table' + (isKv ? ' class="kv-table"' : '') + '><thead><tr>'
              head.forEach((c, i) => {
                table += '<th' + (nowrapCol[i] ? ' class="cell-nowrap"' : '') + '>' + inlineFormat(c) + '</th>'
              })
              table += '</tr></thead><tbody>'
              rows.slice(1).forEach((row) => {
                table += '<tr>'
                parseRow(row).forEach((c, i) => {
                  table += '<td' + (nowrapCol[i] ? ' class="cell-nowrap"' : '') + '>' + inlineFormat(c) + '</td>'
                })
                table += '</tr>'
              })
              table += '</tbody></table>'
              html.push(table)
              continue
            }
          }
          if (/^(- |\d+\. )/.test(block)) {
            const lines = block.split('\n')
            const ordered = /^\d+\. /.test(lines[0])
            const tag = ordered ? 'ol' : 'ul'
            const items = lines
              .map((line) => line.replace(/^(- |\d+\. )/, ''))
              .map((line) => '<li>' + inlineFormat(line) + '</li>')
              .join('')
            html.push('<' + tag + '>' + items + '</' + tag + '>')
            continue
          }
          if (block === '---') { html.push('<hr />'); continue }
          const linkMatch = block.match(/^\[([^\]]+)\]\(([^)]+)\)$/)
          if (linkMatch) {
            let href = linkMatch[2].trim()
            if (!/^(https?:|data:)/i.test(href) && !href.startsWith('./') && !href.startsWith('/')) href = base + href
            else if (href.startsWith('./')) {
              const rest = href.slice(2)
              const baseNoDot = base.replace(/^\.\//, '')
              href = (baseNoDot && rest.startsWith(baseNoDot)) ? './' + rest : base + rest
            }
            html.push(
              '<p><a href="' + escapeHtml(href) + '" target="_blank" rel="noopener">' +
              escapeHtml(linkMatch[1]) + '</a></p>'
            )
            continue
          }
          const imgLines = block.split('\n').map((l) => l.trim()).filter(Boolean)
          if (imgLines.length && imgLines.every((line) => /^!\[([^\]]*)\]\(([^)]+)\)$/.test(line))) {
            html.push(imgLines.map((line) => {
              const m = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/)
              return renderMarkdownImage(m[1], m[2].trim(), assetBase)
            }).join('\n'))
            continue
          }
          if (/<span class="tag/.test(block)) {
            const tags = block.replace(
              /<span class="tag([^"]*)">([\s\S]*?)<\/span>/g,
              (_, cls, label) => '<span class="tag' + cls + '">' + escapeHtml(label.trim()) + '</span>'
            )
            html.push('<div class="tag-row">' + tags.replace(/\n/g, ' ') + '</div>')
            continue
          }
          html.push(
            '<p>' + block.split('\n').map((line) => inlineFormat(line)).join('<br>') + '</p>'
          )
        }
        return html.join('\n')
      }
      function ensureLightbox() {
        let lb = document.getElementById('img-lightbox')
        if (lb) return lb
        lb = document.createElement('div')
        lb.id = 'img-lightbox'
        lb.className = 'img-lightbox'
        lb.innerHTML =
          '<img alt="" /><div class="lb-hint">滚轮持续放大/缩小 · 拖拽移动 · 点空白或 Esc 关闭</div>'
        document.body.appendChild(lb)
        const lbImg = lb.querySelector('img')
        let scale = 1
        let tx = 0
        let ty = 0
        let dragging = false
        let lastX = 0
        let lastY = 0

        function applyTransform() {
          lbImg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'
        }
        function resetView() {
          scale = 1
          tx = 0
          ty = 0
          dragging = false
          lb.classList.remove('is-dragging')
          applyTransform()
        }
        const close = () => {
          lb.classList.remove('is-open')
          resetView()
        }
        lb.addEventListener('click', (e) => {
          if (e.target === lb || e.target.classList.contains('lb-hint')) close()
        })
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && lb.classList.contains('is-open')) close()
        })
        lb.addEventListener(
          'wheel',
          (e) => {
            if (!lb.classList.contains('is-open')) return
            e.preventDefault()
            const rect = lbImg.getBoundingClientRect()
            const ox = (e.clientX - (rect.left + rect.width / 2)) / scale
            const oy = (e.clientY - (rect.top + rect.height / 2)) / scale
            const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12
            const next = Math.min(8, Math.max(0.5, scale * factor))
            if (next === scale) return
            tx += ox * (scale - next)
            ty += oy * (scale - next)
            scale = next
            applyTransform()
          },
          { passive: false },
        )
        lbImg.addEventListener('pointerdown', (e) => {
          if (!lb.classList.contains('is-open') || e.button !== 0) return
          dragging = true
          lastX = e.clientX
          lastY = e.clientY
          lb.classList.add('is-dragging')
          try { lbImg.setPointerCapture(e.pointerId) } catch (_) {}
          e.preventDefault()
        })
        lbImg.addEventListener('pointermove', (e) => {
          if (!dragging) return
          tx += e.clientX - lastX
          ty += e.clientY - lastY
          lastX = e.clientX
          lastY = e.clientY
          applyTransform()
        })
        const endDrag = (e) => {
          if (!dragging) return
          dragging = false
          lb.classList.remove('is-dragging')
          try { lbImg.releasePointerCapture(e.pointerId) } catch (_) {}
        }
        lbImg.addEventListener('pointerup', endDrag)
        lbImg.addEventListener('pointercancel', endDrag)
        lbImg.addEventListener('click', (e) => e.stopPropagation())
        lb._resetView = resetView
        return lb
      }
      function markPhoneFigures(root) {
        root.querySelectorAll('.doc-figure:not(.is-phone) img[data-lightbox]').forEach((img) => {
          const apply = () => {
            if (!img.naturalWidth) return
            // 竖屏（高明显大于宽）按手机尺寸收窄
            if (img.naturalHeight > img.naturalWidth * 1.15) {
              const fig = img.closest('.doc-figure')
              if (fig && !fig.closest('.doc-compare')) fig.classList.add('is-phone')
            }
          }
          if (img.complete) apply()
          else img.addEventListener('load', apply)
        })
      }
      function bindProtoFrameResize(root) {
        window.addEventListener('message', (e) => {
          const data = e && e.data
          if (!data || data.type !== 'veigar-proto-resize') return
          const h = Number(data.height)
          if (!h || h < 100) return
          root.querySelectorAll('iframe[data-proto-frame]').forEach((frame) => {
            try {
              if (frame.contentWindow === e.source) {
                frame.style.height = Math.ceil(h) + 'px'
              }
            } catch (_) { /* ignore */ }
          })
        })
      }
      function bindDocImageLightbox(root) {
        const lb = ensureLightbox()
        const lbImg = lb.querySelector('img')
        root.querySelectorAll('img[data-lightbox]').forEach((img) => {
          img.addEventListener('click', () => {
            if (typeof lb._resetView === 'function') lb._resetView()
            lbImg.src = img.currentSrc || img.src
            lbImg.alt = img.alt || ''
            lb.classList.add('is-open')
          })
        })
        markPhoneFigures(root)
        bindProtoFrameResize(root)
        bindDocTabs(root)
      }
      function bindDocTabs(root) {
        root.querySelectorAll('.doc-tabs').forEach((wrap) => {
          wrap.querySelectorAll('.doc-tab-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
              const i = btn.getAttribute('data-tab')
              wrap.querySelectorAll('.doc-tab-btn').forEach((b) => b.classList.toggle('is-on', b === btn))
              wrap.querySelectorAll('.doc-tab-pane').forEach((p) => p.classList.toggle('is-on', p.getAttribute('data-pane') === i))
            })
          })
        })
      }
      function mountDocToc(root) {
        const box = document.getElementById('docToc')
        const panel = document.getElementById('docTocPanel')
        if (!box || !panel) return
        const used = Object.create(null)
        const items = []
        root.querySelectorAll('h2, h3').forEach((el) => {
          const text = String(el.textContent || '').replace(/\s+/g, ' ').trim()
          if (!text) return
          let base = 'sec-' + text.replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fff\-]/g, '')
          if (base === 'sec-') base = 'sec'
          let id = base
          let n = 2
          while (used[id]) { id = base + '-' + n; n++ }
          used[id] = true
          el.id = id
          items.push({ id: id, text: text, level: el.tagName === 'H3' ? 3 : 2 })
        })
        if (!items.length) {
          box.hidden = true
          panel.innerHTML = ''
          return
        }
        box.hidden = false
        panel.innerHTML = items.map(function (it) {
          return '<a class="toc-l' + it.level + '" href="#' + it.id + '" title="' + escapeHtml(it.text) + '">' + escapeHtml(it.text) + '</a>'
        }).join('')
        const links = panel.querySelectorAll('a')
        links.forEach(function (a) {
          a.addEventListener('click', function (e) {
            e.preventDefault()
            const target = document.getElementById(a.getAttribute('href').slice(1))
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' })
          })
        })
        function syncActive() {
          let current = items[0] && items[0].id
          items.forEach(function (it) {
            const el = document.getElementById(it.id)
            if (el && el.getBoundingClientRect().top <= 72) current = it.id
          })
          links.forEach(function (a) {
            a.classList.toggle('is-active', a.getAttribute('href') === '#' + current)
          })
        }
        window.addEventListener('scroll', syncActive, { passive: true })
        syncActive()
      }

      // 文档刷新：停留在刚才阅读位置（不置顶）。原型.html 单独打开时自行置顶，与文档分开。
      const DOC_SCROLL_KEY = 'bty-local-doc-scroll:' + location.pathname
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      let savedScroll = 0
      try { savedScroll = Number(sessionStorage.getItem(DOC_SCROLL_KEY) || 0) || 0 } catch (_) {}
      function saveDocScroll() {
        try { sessionStorage.setItem(DOC_SCROLL_KEY, String(window.scrollY || 0)) } catch (_) {}
      }
      function restoreDocScroll() {
        const y = Math.max(0, savedScroll)
        const apply = () => window.scrollTo(0, y)
        apply()
        requestAnimationFrame(apply)
        setTimeout(apply, 80)
        setTimeout(apply, 320)
      }
      let scrollTimer = null
      window.addEventListener('scroll', () => {
        if (scrollTimer) clearTimeout(scrollTimer)
        scrollTimer = setTimeout(saveDocScroll, 120)
      }, { passive: true })
      window.addEventListener('beforeunload', saveDocScroll)

      const page = window.DOC_PAGE || {}
      const bodyEl = document.getElementById('body')
      bodyEl.innerHTML = renderMarkdown(page.text || '', './')
      bindDocImageLightbox(bodyEl)
      mountDocToc(bodyEl)
      restoreDocScroll()
    })()
  </script>
</body>
</html>
